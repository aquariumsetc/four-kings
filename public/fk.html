<style>

}

.fan .whobadge{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;background:var(--felt-deep);display:grid;place-items:center;font-size:.8rem;box-shadow:0 0 0 2px var(--ivory);z-index:3;pointer-events:none} /* who played this card */
/* v2.8.7 top avatar strip (phones): the ring sits on whoever we're waiting on; it hops with the run */
#fkstripwrap .fkstrip{position:fixed;left:0;right:0;top:0;z-index:8;padding:12px 6px 8px;padding-top:calc(12px + env(safe-area-inset-top,0px));

  border-bottom:1px solid var(--line);overflow:visible;clip-path:inset(-60px 0 0 0);display:none}

body.hasvid #fkstripwrap .fkstrip{top:calc(124px + env(safe-area-inset-top,0px))}

.fkstrip .fkbal{font-size:.68rem;color:rgba(251,247,236,.6)}
.fkstrip .fkchip.cur .fkava{background:var(--brass);color:#2b2200;box-shadow:0 0 22px rgba(201,162,39,.6)}
.fkstrip .fkchip.cur .fkava::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--brass);pointer-events:none;box-shadow:0 0 14px 2px rgba(201,162,39,.9),0 0 30px 7px rgba(201,162,39,.5)}
.fkstrip .fkchip.cur .fknm{color:var(--brass)}
.fkstrip .fkchip.owe .fkava{box-shadow:0 0 0 3px var(--brass);animation:fkowe 1.1s ease-in-out infinite}
@keyframes fkowe{50%{box-shadow:0 0 0 3px var(--brass),0 0 20px rgba(201,162,39,.6)}}

@keyframes fkpop{30%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.fkstrip .fkchip{transition:none}.fkstrip .fkchip.owe .fkava,.fkstrip .fkchip.just .fkava{animation:none}}
/* fit: reserve space for the fixed strip and drop the now-duplicate standings on phones */
.app.fkstripon{padding-top:calc(104px + env(safe-area-inset-top,0px))}

<body>
<div class="app" id="app"></div>
<div id="fkstripwrap"></div>
<div id="vid"></div>
<div id="banner"></div>
<div class="conn" id="conn"></div>
<div id="sndhint" hidden>🔇 Tap anywhere for sound</div>
<script>
(function(){
const VERSION='v2.8.56 · 28 Oct 2026'; // shown at the bottom of every screen
const SUITS=['S','H','D','C'];
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const NAME={S:'spades',H:'hearts',D:'diamonds',C:'clubs'};
const RED={S:false,H:true,D:true,C:false};
const RN={1:'A',11:'J',12:'Q'};
const WORD={1:'ace',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'jack',12:'queen'};
const rname=r=>RN[r]||String(r);
const cs=c=>rname(c.r)+SYM[c.s];
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const CLAIM_MS=5000;
const get=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const set=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

let pid=get('fk-pid'); if(!pid){ pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36); set('fk-pid',pid); }
let myPhoto=get('fk-photo')||''; const photos={}; if(myPhoto) photos[pid]=myPhoto; // selfie avatars keyed by pid (shared via the {t:'photo'} channel; emoji fallback)
const qs=new URLSearchParams(location.search);
const framed=qs.get('framed')==='1'||window.parent!==window; // inside the Game Night shell: the shell owns the camera + video bar, so this frame runs video-free and never navigates away

/* ---------- connection ---------- */
function connect(){
  if(!room||!mode) return;
  if(ws){ try{ws.onclose=null;ws.close();}catch(e){} }
  const proto=location.protocol==='https:'?'wss':'ws'; set('fk-last',mode);
  const role=mode==='lounge'?(get('fk-lhost')===room?'both':'hand'):mode;
  ws=new WebSocket(`${proto}://${location.host}/ws/${room}?pid=${encodeURIComponent(pid)}&role=${role}`);
  connEl.textContent='connecting…';
  ws.onopen=()=>{ connEl.textContent='● live'; reconnectIn=800; keepAwake(); ws.send(JSON.stringify({t:'hello'})); if(myPhoto) ws.send(JSON.stringify({t:'photo',photo:myPhoto})); if(!framed&&rtc.on) ws.send(JSON.stringify({t:'video',on:true})); if(!framed&&isTbl()) loadIce(); };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.t==='err'){ viewMsg=m.msg; render(); setTimeout(()=>{viewMsg='';render();},2500); return; }
    if(m.t==='rtc'){ onRtc(m.from,m.data); return; }
    if(m.t==='photo'){ if(m.photo) photos[m.pid]=m.photo; else delete photos[m.pid]; if(S) paintFkStrip(S); return; }
    if(m.t==='closed'){ if(!framed) location.replace('/?home=1'); return; } // session finished (standalone goes home; framed is handled by the shell)
    if(m.t==='state'){ prev=S; S=m.s; onState(S,prev); render(); syncPeers(); } };
  ws.onclose=()=>{ connEl.textContent='reconnecting…'; setTimeout(connect,reconnectIn); reconnectIn=Math.min(reconnectIn*1.6,8000); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
function sendMsg(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function onState(st,old){
  // the table moved everyone to Ultium UNO: follow it (same code, same name)
  if(st.goto&&st.goto.to==='uno'&&st.goto.at>+(qs.get('from')||0)){ if(framed) return; const bots=st.host&&st.goto.bots?'&bots='+st.goto.bots:''; const m2=mode==='lounge'?(st.host?'both':'hand'):mode; const lay=st.host&&st.goto.layout==='phones'?'&layout=phones':''; location.replace('/uno.html?room='+room+'&mode='+m2+'&from='+st.goto.at+bots+lay); return; }
  // the room picked 4 Kings: everyone's straight into the table on their own device
  if(mode==='lounge'&&!st.lounge&&!wantLounge){ mode=st.host?'both':'hand'; set('fk-mode',mode); }
  if(mode!=='table'&&!autoTried&&!st.players.some(p=>p.id===pid)&&nick){ autoTried=true; sendMsg({t:'join',name:nick,auto:autoOn,emoji}); }
  else if(!st.players.some(p=>p.id===pid)) autoTried=true;
  if(qs.get('bots')&&st.host&&st.phase==='lobby'&&!st.players.some(p=>p.bot)){ for(let k=0;k<Math.min(7,+qs.get('bots'));k++) sendMsg({t:'addbot'}); history.replaceState(null,'','/?room='+room+'&mode='+mode+(qs.get('from')?'&from='+qs.get('from'):'')); qs.delete('bots'); }
  if(framed&&st.host&&st.phase==='lobby'&&st.players.length>=2&&!autoStartTried){ autoStartTried=true; setTimeout(()=>{ if(S&&S.host&&S.phase==='lobby'&&S.players.length>=2) sendMsg({t:'start'}); },1200); } // launched from the room: start straight in once 2+ players are present — never auto-adds a bot (bots are added only by tapping Add a bot)
  if(framed&&st.host&&st.phase==='over'&&st.autoNext&&!autoNextOff){ autoNextOff=true; sendMsg({t:'settings',autoNext:false}); } // room flow: no auto-advance — "Play another game" is an explicit tap
  if(wantLayout&&st.host){ sendMsg({t:'settings',layout:wantLayout}); wantLayout=''; }
  if(wantLounge&&st.lounge) wantLounge=false; else if(wantLounge&&st.host) sendMsg({t:'toroom'}); // keep asking until the server confirms it's a room
  // the host took everyone back to the Game Night room: this page becomes the room (no reload, video stays up)
  if(!framed&&st.lounge&&(mode==='hand'||mode==='both')){ if(st.host) set('fk-lhost',room); mode='lounge'; set('fk-mode',mode); }
  // video was on before (e.g. in the Game Night room): switch it back on
  if(!framed&&!autoVidTried&&get('gn-video')==='1'&&mode!=='table'&&!rtc.on){ autoVidTried=true; setTimeout(()=>{ if(!rtc.on) startVideo(); },400); }
  if(mode!=='table'&&mode!=='lounge'&&!get('fk-howto')){ set('fk-howto','1'); setTimeout(showHowto,300); }
  skew=st.serverNow-Date.now();
  const m=me(st); if(m&&!m.bot&&m.auto!==autoOn) sendMsg({t:'autoplay',on:autoOn});
  if(st.phase==='claim'&&(!old||old.phase!=='claim'||old.run.length!==st.run.length||old.runSuit!==st.runSuit)) claimSeen=Date.now();
  if(mode!=='table'&&st.phase==='ante'&&(!old||old.phase!=='ante')) draft={suits:[],total:10};
  if(st.phase==='ante'&&st.dealAt&&(!old||old.dealAt!==st.dealAt)) dealSeen=Date.now()+(st.dealAt-st.serverNow);
  if(st.event&&st.event.at!==lastEvent){ if(old) showBanner(st); lastEvent=st.event.at; }
  try{ soundsFor(st,old); }catch(e){}
  announce(st,old);
}
function showBanner(st){

/* ---------- sounds (all synthesised, nothing to download) ---------- */
let actx=null, audioStale=false;
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function ac(){ if(document.hidden) return null; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; if(actx&&actx.state==='closed') actx=null; actx=actx||new AC(); if(actx.state!=='running') actx.resume().catch(()=>{}); return actx; }
// iOS pauses page audio when the phone locks or the app goes to the background, and only lets it
// start again from a tap. After a lock some iOS versions leave the old audio engine silent, so the
// first tap after coming back builds a fresh one.
function unlockAudio(){
  try{
    if(audioStale&&actx){ const hadMusic=music.on; musicHalt(); try{ actx.close(); }catch(e){} actx=null; if(hadMusic) music.want=true; }
    audioStale=false;
    const a=ac(); if(!a) return;
    const b=a.createBuffer(1,1,22050), src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start(0);
    if((musicOn||music.want)&&!music.on&&room&&mode){ music.want=false; musicStart(); }
    if('speechSynthesis' in window) speechSynthesis.resume();
  }catch(e){}
}
let wake=null;
async function keepAwake(){ try{ if(room&&mode&&'wakeLock' in navigator&&!document.hidden&&(!wake||wake.released)) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) keepAwake(); });
['touchend','click'].forEach(ev=>document.addEventListener(ev,keepAwake,{passive:true}));
function showHowto(){

  const d=document.createElement('div'); d.id='howto';
  d.innerHTML=`<div class="sheet"><h2>How to play 4 Kings</h2>
    ${st(1,'Bet on one or two <b>kings</b>. The same again goes in the centre. Last game\u2019s bet is kept for you.')}
    ${st(2,'The leader plays their lowest card of a suit. Whoever holds the <b>next card up</b> taps it in their hand, one card at a time.')}
    ${st(3,'Play a <b>queen</b> to win that king\u2019s money. When a run stops, the next lead is the other colour.')}
    ${st(4,'First to play every card takes the <b>centre</b>. Turn on <b>beginner hints</b> at the bottom for extra help.')}
    <button class="big" id="howtook">Let\u2019s play</button></div>`;
  document.body.appendChild(d); d.querySelector('#howtook').onclick=()=>d.remove();
}
function soundBlocked(){ return (sfxOn||winOn||musicOn)&&room&&mode&&(!actx||actx.state!=='running'||audioStale); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(IOS) audioStale=true; if(actx) actx.suspend().catch(()=>{}); } else if(actx) actx.resume().catch(()=>{}); });
window.addEventListener('pageshow',e=>{ if(e.persisted&&IOS) audioStale=true; });
function tone(f,t0,dur,vol,type){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.001,t0+dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05); }

const sfx={
  card(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; noise(t,.07,.5,900); tone(180,t+.01,.06,.12,'sine'); },
  deal(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; for(let i=0;i<10;i++) noise(t+i*.055,.04,.35,1500); },
  stop(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; tone(140,t,.25,.3,'sine'); noise(t,.12,.25,300); },
  lead(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; tone(880,t,.12,.18,'sine'); tone(1175,t+.14,.18,.18,'sine'); },

  beep(last){ if(!sfxOn) return; const a=ac(); if(!a) return; tone(last?1320:990,a.currentTime,last?.18:.09,.14,'square'); },
  bet(){ if(!sfxOn) return; const a=ac(); if(!a) return; coins(3,.2); }

function soundsFor(st,old){
  if(!old) return;
  const runGrew=st.run.length>old.run.length&&(st.phase==='claim'||st.phase==='play'||st.phase==='over');
  if(runGrew) sfx.card();
  if(st.phase==='swap'&&old.phase==='ante') sfx.deal();
  if(st.phase==='play'&&old.phase==='claim'&&st.run.length===old.run.length) sfx.stop();
  if(st.phase==='play'&&(old.phase!=='play'||old.leader!==st.leader)&&mode!=='table'&&st.players[st.leader]&&st.players[st.leader].id===pid) sfx.lead();
  if(st.phase==='ante'&&old.phase==='ante'&&st.players.filter(p=>p.placed).length>old.players.filter(p=>p.placed).length&&!(mode!=='table'&&st.players.some(p=>p.id===pid&&p.placed&&!old.players.find(o=>o.id===pid&&o.placed)))) sfx.bet();
}

/* ---------- background music: an original lo-fi loop, generated on the device ---------- */
const music={on:false,timer:null,step:0,next:0,master:null,delay:null};
const CHORDS=[[57,60,64,67],[62,65,69,72],[55,59,62,65],[60,64,67,71]]; // Am7 Dm7 G7 Cmaj7 (MIDI)
const PENTA=[69,72,74,76,79,81,84];
const mhz=m=>440*Math.pow(2,(m-69)/12);

  const g=a.createGain(); g.gain.value=0; g.connect(a.destination); g.gain.linearRampToValueAtTime(.55,a.currentTime+2); music.master=g;
  const d=a.createDelay(1); d.delayTime.value=.36; const fb=a.createGain(); fb.gain.value=.32; const df=a.createBiquadFilter(); df.type='lowpass'; df.frequency.value=1800; d.connect(df).connect(fb).connect(d); d.connect(g); music.delay=d;

}
function musicHalt(){ if(!music.on) return; music.on=false; clearInterval(music.timer); try{ music.crackle&&music.crackle.stop(); }catch(e){} music.master=null; }
function musicStop(){ if(!music.on) return; music.on=false; clearInterval(music.timer); const a=ac(); if(music.master){ const g=music.master; g.gain.linearRampToValueAtTime(0,a.currentTime+1.2); setTimeout(()=>{ try{ g.disconnect(); music.crackle.stop(); }catch(e){} },1400); } }

    if(inBar===0||inBar===8||inBar===10){ const o=a.createOscillator(), og=a.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12); og.gain.setValueAtTime(.5,t); og.gain.exponentialRampToValueAtTime(.001,t+.22); o.connect(og).connect(g); o.start(t); o.stop(t+.25); }

    if(inBar%2===0||Math.random()<.35){ const nb=a.createBuffer(1,a.sampleRate*.04,a.sampleRate), c=nb.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=(Math.random()*2-1)*(1-i/c.length); const ns=a.createBufferSource(); ns.buffer=nb; const nf=a.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=7000; const ng=a.createGain(); ng.gain.value=inBar%4===2?.12:.07; ns.connect(nf).connect(ng).connect(g); ns.start(t); }

    music.step++; music.next+=sixteenth;

}

/* ---------- speech (table only) ---------- */
function say(t){ try{ if(!isTbl()||!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; speechSynthesis.speak(u);}catch(e){} }
function announce(st,old){
  if(!old||st.v===old.v) return;
  if(st.phase==='claim'&&st.run.length>(old.phase==='claim'&&old.runSuit===st.runSuit?old.run.length:0)){
    const n=tailLen(st); const tail=st.run.slice(st.run.length-n);
    say(tail.map(x=>WORD[x.c.r]+' of '+NAME[x.c.s]).join(', ')+'. Who has the '+WORD[st.nextRank]+'?');
  } else if(st.phase==='play'&&old.phase!=='play'){ say((st.note?st.note+' ':'')+pname(st,st.leader)+', your lowest '+(st.colour||'card')); }
  else if(st.phase==='over'&&old.phase!=='over'){ say(st.winner?(st.note?st.note+' ':'')+pname(st,st.winner.idx)+' is out of cards and takes the centre, '+st.winner.won+' dollars.':st.note); }
  else if(st.phase==='ante'&&old.phase!=='ante'){ say('Place your bets.'); }
  else if(st.phase==='swap'&&old.phase==='ante'){ say(swapRace(st)?'Cards are dealt. Keep or swap? First to swap gets the spare hand.':'Cards are dealt. '+pname(st,st.swapTurn)+', keep or swap?'); }
  else if(st.phase==='swap'&&!swapRace(st)&&old.phase==='swap'&&old.swapTurn!==st.swapTurn){ say(pname(st,st.swapTurn)+', keep or swap?'); }
}

/* ---------- video: WebRTC mesh between everyone at this table ---------- */
const rtc={on:false,mic:false,joining:false,queue:[],stream:null,peers:{},ice:{iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]},iceLoaded:false};
const vidEl=document.getElementById('vid');
async function loadIce(){ if(rtc.iceLoaded) return; try{ const r=await fetch('/ice'); if(r.ok){ rtc.ice=await r.json(); } }catch(e){} rtc.iceLoaded=true; }
async function startVideo(){
  if(framed) return; // the shell owns the camera

function faceOf(st,i){ const p=st.players&&st.players[i]; return p?(p.bot?'🤖':(p.emoji||(p.name||'?').charAt(0).toUpperCase())):''; }

  if(q('#switch')) q('#switch').onclick=()=>{ stopVideo(); Object.keys(rtc.peers).forEach(closePeer); mode=mode==='hand'?'table':mode==='both'?'table':'hand'; set('fk-mode',mode); S=null; render(); renderVideo(); connect(); };
  if(q('#unotable')) q('#unotable').onclick=()=>{ location.href='/uno.html?setup=table'; };
  if(q('#newlounge')) q('#newlounge').onclick=()=>{ room=newCode(); mode='lounge'; wantLounge=true; set('fk-lhost',room); set('fk-room',room); set('fk-mode',mode); history.replaceState(null,'','/'); S=null; render(); connect(); };
  if(q('#lgofk')) q('#lgofk').onclick=()=>sendMsg({t:'settings',layout:'phones',lounge:false});
  if(q('#lgouno')) q('#lgouno').onclick=()=>{ sendMsg({t:'settings',layout:'phones'}); sendMsg({t:'switchgame',to:'uno'}); };
  if(q('#unophones')) q('#unophones').onclick=()=>{ location.href='/uno.html?setup=phones'; };
  if(q('#newphones')) q('#newphones').onclick=()=>{ room=newCode(); mode='both'; wantLayout='phones'; set('fk-room',room); set('fk-mode',mode); say(' '); S=null; render(); connect(); };
  app.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>sendMsg({t:'settings',layout:b.dataset.layout}));
  if(q('#joinuno')) q('#joinuno').onclick=()=>{ const c=q('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length<3){ q('#code').focus(); return; } location.href='/uno.html?room='+c+'&mode=hand'; };
  if(q('#rejoinfk')) q('#rejoinfk').onclick=()=>{ room=get('fk-room'); mode=get('fk-last'); set('fk-mode',mode); history.replaceState(null,'','/'); S=null; render(); connect(); };
  if(q('#rejoinuno')) q('#rejoinuno').onclick=()=>{ location.href='/uno.html?room='+get('uno-room')+'&mode='+get('uno-last'); };
  if(q('#leaveRoom')) q('#leaveRoom').onclick=()=>{ if(framed){ tellShell('home'); return; } stopVideo(); Object.keys(rtc.peers).forEach(closePeer); if(ws){ws.onclose=null;ws.close();} ws=null; S=null; mode=''; set('fk-mode',''); render(); renderVideo(); };
  if(q('#start')) q('#start').onclick=()=>sendMsg({t:'start'}); if(q('#sharelink')) q('#sharelink').onclick=async()=>{ const b=q('#sharelink'), link=b.dataset.link; try{ if(navigator.share){ await navigator.share({title:'4 Kings, table '+room,text:'Join my 4 Kings table',url:link}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } try{ await navigator.clipboard.writeText(link); b.textContent='Copied!'; }catch(e){ prompt('Copy this link:',link); } setTimeout(()=>{ if(b.isConnected) b.textContent='🔗 Share join link'; },1800); };
  if(q('#addbot')) q('#addbot').onclick=()=>sendMsg({t:'addbot'});
  app.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>sendMsg({t:'settings',claimMs:+b.dataset.timer}));
  if(q('#removebot')) q('#removebot').onclick=()=>sendMsg({t:'removebot'});
  if(q('#clearboard')) q('#clearboard').onclick=()=>{ if(confirm('Reset the season scoreboard?')) sendMsg({t:'clearboard'}); };
  if(q('#reset')) q('#reset').onclick=()=>{ if(confirm('Clear the table for everyone?')) sendMsg({t:'reset'}); };
  if(q('#nextgame')) q('#nextgame').onclick=()=>sendMsg({t:'next'});
  if(q('#endsession')) q('#endsession').onclick=()=>{ if(confirm('Finish the game session for everyone? This ends the game and closes the room — every player goes back to home.')){ if(framed) tellShell('endsession'); else { sendMsg({t:'endsession'}); setTimeout(()=>location.replace('/?home=1'),300); } } };
  if(q('#join')) q('#join').onclick=()=>{ nick=q('#nick').value.trim().slice(0,18)||'Player'; set('fk-nick',nick); sendMsg({t:'join',name:nick,auto:autoOn,emoji}); };
  if(q('#leave')) q('#leave').onclick=()=>sendMsg({t:'leave'});
  app.querySelectorAll('[data-king]').forEach(b=>b.onclick=()=>{ const s=b.dataset.king; if(draft.suits.includes(s)) draft.suits=draft.suits.filter(x=>x!==s); else if(draft.suits.length<2) draft.suits.push(s); else draft.suits=[draft.suits[1],s]; if(draft.suits.length===2&&draft.total<20) draft.total=20; render(); });
  app.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ draft.total=Math.max(10,draft.total+(+b.dataset.bet)); render(); });
  if(q('#place')) q('#place').onclick=()=>{ q('#place').disabled=true; if(sfxOn){ try{ coins(6,.35); }catch(e){} } sendMsg({t:'bet',bets:betsOf(draft)}); };
  if(q('#deal')) q('#deal').onclick=()=>sendMsg({t:'deal'});
  if(q('#keep')) q('#keep').onclick=()=>{ q('#keep').disabled=q('#swap').disabled=true; sfx.tap(); sendMsg({t:'swap',swap:false}); };
  if(q('#swap')) q('#swap').onclick=()=>{ q('#keep').disabled=q('#swap').disabled=true; sfx.tap(); sendMsg({t:'swap',swap:true}); };
  app.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{ b.disabled=true; sfx.tap(); sendMsg({t:'lead',suit:b.dataset.lead}); });
  if(q('#claim')) q('#claim').onclick=()=>{ q('#claim').disabled=true; sendMsg({t:'claim'}); };
  app.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{ if(!S||S.phase!=='claim') return; const need=S.runSuit+S.nextRank; if(b.dataset.claim===need){ b.disabled=true; sfx.tap(); sendMsg({t:'claim'}); } else { viewMsg='Not that one.'; render(); setTimeout(()=>{ if(viewMsg==='Not that one.'){ viewMsg=''; render(); } },1200); } });
  if(q('#autoplay')) q('#autoplay').onclick=()=>{ autoOn=!autoOn; set('fk-auto',autoOn?'1':'0'); sendMsg({t:'autoplay',on:autoOn}); render(); };
  if(q('#rebuy')) q('#rebuy').onclick=()=>{ q('#rebuy').disabled=true; sendMsg({t:'rebuy'}); };
  app.querySelectorAll('[data-swapmode]').forEach(b=>b.onclick=()=>sendMsg({t:'settings',swapMode:b.dataset.swapmode}));
  app.querySelectorAll('[data-autonext]').forEach(b=>b.onclick=()=>sendMsg({t:'settings',autoNext:b.dataset.autonext==='1'}));
  if(q('#switchgame')) q('#switchgame').onclick=()=>{ if(confirm('Switch everyone at this table to Ultium UNO? Phones follow automatically.')) sendMsg({t:'switchgame',to:'uno'}); };
  document.querySelectorAll('#toroom').forEach(b=>b.onclick=()=>{ if(confirm('Take everyone back to the Game Night room? Money and the scoreboard are kept; bots leave.')) { set('fk-lhost',room); sendMsg({t:'toroom'}); } });
  if(q('#notyou')) q('#notyou').onclick=()=>{ set('fk-nick',''); nick=''; autoTried=true; sendMsg({t:'leave'}); };
  if(q('#howtobtn')) q('#howtobtn').onclick=showHowto;
  if(q('#rulesToggle')) q('#rulesToggle').onclick=()=>{ showRules=!showRules; render(); };
  if(q('#hints')) q('#hints').onclick=()=>{ hints=!hints; set('fk-hints',hints?'1':'0'); render(); };
  if(q('#sfx')) q('#sfx').onclick=()=>{ sfxOn=!sfxOn; set('fk-sfx',sfxOn?'1':'0'); if(sfxOn) sfx.card(); render(); };
  if(q('#musicbtn')) q('#musicbtn').onclick=()=>{ musicOn=!musicOn; set('fk-music',musicOn?'1':'0'); try{ musicOn?musicStart():musicStop(); }catch(e){} render(); };
  if(q('#winsnd')) q('#winsnd').onclick=()=>{ winOn=!winOn; set('fk-win',winOn?'1':'0'); if(winOn){ try{ chime(false); coins(10,.3); }catch(e){} } render(); };
}

['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true,capture:true}));
if(qs.get('room')&&qs.get('mode')){ set('fk-room',room); set('fk-mode',mode); }
if(qs.get('home')) history.replaceState(null,'','/'); // the home-screen icon opens the home page once; a refresh later resumes the table
render();
if(room&&mode) connect();
})();
</script>
</body>
</html>
