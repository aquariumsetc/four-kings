<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#153f2a">
<title>Four Kings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --felt:#1f5a3a; --felt-deep:#153f2a; --felt-light:#2a7049;
  --ivory:#fbf7ec; --ink:#1b1a17; --red:#b8232a; --brass:#c9a227; --brass-deep:#8c6d12;
  --bg:var(--felt); --fg:#fbf7ec; --panel:rgba(0,0,0,.28);
  --btn:var(--ivory); --btn-fg:var(--ink); --btn-2:rgba(251,247,236,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{ --felt:#163f2a; --felt-deep:#0f2b1d; --bg:#163f2a; color-scheme:dark; } }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg) radial-gradient(ellipse at 50% 20%,var(--felt-light) 0%,var(--felt) 45%,var(--felt-deep) 100%);color:var(--fg);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt-deep)}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:2.4rem;line-height:1.05} h2{font-size:1.6rem;line-height:1.15} h3{font-size:1.15rem}
p{margin:.4rem 0}
.app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.app.table{max-width:1100px}
button{font:inherit;border:0;border-radius:12px;padding:.8rem 1.1rem;cursor:pointer;background:var(--btn);color:var(--btn-fg);font-weight:600}
button.ghost{background:var(--btn-2);color:var(--fg);font-weight:500}
button.big{width:100%;padding:1rem;font-size:1.1rem;margin-top:.6rem}
button.huge{width:100%;padding:1.6rem;font-size:1.5rem;margin-top:.8rem;background:var(--brass);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;padding:.7rem .8rem;border-radius:10px;border:1px solid rgba(0,0,0,.25);background:var(--ivory);color:var(--ink);width:100%}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:"Fraunces",Georgia,serif;font-size:1.6rem;text-align:center}
.muted{opacity:.78}.small{font-size:.86rem}
.row{display:flex;gap:.6rem;align-items:center}.row>*{flex:1}
.notice{background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.5);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0}
.panel{background:var(--panel);border-radius:14px;padding:.7rem .9rem;margin:.6rem 0}
.kings{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:6px;background:var(--panel);border-radius:16px;padding:10px 8px 8px;align-items:end}
.spot{text-align:center}
.spot .k{display:block;width:100%;aspect-ratio:5/7;max-width:70px;margin:0 auto;border-radius:6px;background:var(--ivory);color:var(--ink);font-family:"Fraunces",Georgia,serif;font-size:1.4rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.spot .k.red{color:var(--red)}
.coins{margin-top:4px;font-size:.95rem;font-weight:600;color:var(--brass)}
.pot{text-align:center;border-left:1px solid rgba(251,247,236,.18);padding-left:6px}
.pot .n{font-family:"Fraunces",Georgia,serif;font-size:2.2rem;line-height:1;color:var(--brass)}.pot .l{font-size:.78rem;opacity:.8}
/* compact kings on phones */
.app:not(.table) .kings{padding:6px 8px 5px;gap:4px;border-radius:12px}
.app:not(.table) .spot .k{max-width:30px;font-size:.78rem;border-radius:4px;gap:0;aspect-ratio:5/7}
.app:not(.table) .coins{margin-top:2px;font-size:.78rem}
.app:not(.table) .pot .n{font-size:1.3rem}.app:not(.table) .pot .l{font-size:.68rem}
.card{width:38px;height:52px;border-radius:5px;background:var(--ivory);color:var(--ink);font-family:"Fraunces",Georgia,serif;font-size:1.05rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.4);position:relative}
.card.red{color:var(--red)}.card.q{background:linear-gradient(160deg,#fff8dc,var(--ivory))}
.card small{font-size:.7rem;font-weight:500}
.card.lead{outline:3px solid var(--brass);outline-offset:1px}
.card.lg{width:84px;height:116px;font-size:2.2rem;border-radius:9px;box-shadow:0 4px 10px rgba(0,0,0,.4)}.card.lg small{font-size:1.4rem}
.hand{display:flex;flex-direction:column;gap:6px;margin:.8rem 0}
.suitrow{display:flex;align-items:center;gap:4px;min-height:52px}
.suitrow .tag{width:22px;font-family:"Fraunces",Georgia,serif;font-size:1.3rem;text-align:center}.suitrow .tag.red{color:#ff9d99}
.cards{display:flex;gap:4px;flex-wrap:wrap}
button.cardbtn{padding:0;background:none;border-radius:5px}
.tgrid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media (max-width:760px){.tgrid{grid-template-columns:1fr}}
.pile{position:relative;height:280px;background:rgba(0,0,0,.18);border-radius:20px;margin:12px 0;overflow:hidden}
.pile .card{position:absolute;left:50%;top:50%;margin:-58px 0 0 -42px}
.pile .card.who::after{content:attr(data-who);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font:600 .72rem -apple-system,"Segoe UI",sans-serif;color:var(--fg);background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.pile .card.new{animation:land .45s cubic-bezier(.2,.9,.3,1.2)}@keyframes land{from{transform:translate(0,-320px) rotate(-30deg) scale(1.3);opacity:0}}}
.call{text-align:center;font-family:"Fraunces",Georgia,serif;font-size:1.9rem;margin:.4rem 0}
.count{font-size:3.2rem;color:var(--brass);font-family:"Fraunces",Georgia,serif;text-align:center;line-height:1}
.scores table{width:100%;border-collapse:collapse}.scores td{padding:5px 0;border-top:1px solid rgba(251,247,236,.12)}
.scores td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.scores tr.lead td:first-child::before{content:"★ ";color:var(--brass)}
.scores tr.on td:first-child{color:var(--brass)}
.kbtns{display:flex;gap:6px}.kbtns button{flex:1;padding:.7rem 0;font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:700;background:var(--btn-2);color:var(--fg)}
.kbtns button.red{color:#ff9d99}.kbtns button.on{background:var(--ivory);color:var(--ink)}.kbtns button.on.red{color:var(--red)}
.center{text-align:center}
.wait{text-align:center;padding:2rem 0;opacity:.85}
.tick{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brass);margin-right:6px}
.codebig{font-family:"Fraunces",Georgia,serif;font-size:3rem;letter-spacing:.25em;color:var(--brass);text-align:center;line-height:1}
.qrwrap{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.qr{background:#fbf7ec;padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{display:block}
.conn{position:fixed;right:10px;bottom:10px;font-size:.75rem;opacity:.6}
.minirun{display:flex;gap:22px;align-items:center;justify-content:center;padding:10px 6px 24px;background:rgba(0,0,0,.18);border-radius:14px;margin:.6rem 0;min-height:96px}
.fan{position:relative;height:80px;flex:1;max-width:260px}
.fan .card{position:absolute;top:50%;width:40px;height:56px;margin-top:-28px;font-size:1.55rem;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fan .card small{font-size:1.1rem}
.fan .card.last{outline:2px solid var(--brass);outline-offset:1px}
.minirun .card.ghost{width:44px;height:60px;font-size:1.5rem}.minirun .card.ghost small{font-size:1.05rem}
.minirun .lbl{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:.62rem;opacity:.75;margin-top:2px}
.card.ghost{background:transparent;border:2px dashed rgba(251,247,236,.65);color:rgba(251,247,236,.8);box-shadow:none}
.card.ghost.red{color:#ff9d99}
.dealin{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;color:var(--brass);text-align:center}
.won{display:inline-flex;align-items:center;gap:8px;background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.55);border-radius:14px;padding:6px 12px;margin:.3rem auto;font-size:1.05rem}
.won .card{width:34px;height:46px;font-size:1rem;flex:none}.won .card small{font-size:.65rem}
.won .amt{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;color:var(--brass);line-height:1}
.app.table .won{font-size:1.3rem;padding:8px 16px}.app.table .won .card{width:46px;height:62px;font-size:1.3rem}.app.table .won .amt{font-size:2rem}
.leadcall{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;line-height:1.1;text-align:center;margin:.4rem 0}
.leadcall .col{display:inline-block;padding:.05em .35em;border-radius:8px;background:var(--ivory);color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.leadcall .col.red{color:var(--red)}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
#banner:empty{display:none}
.fanfare{background:linear-gradient(160deg,#fff4c2,#e9c54a);color:#2a2410;border-radius:22px;padding:1.2rem 1.6rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 6px rgba(201,162,39,.35);max-width:88vw;animation:pop .5s cubic-bezier(.2,1.4,.4,1),fade .6s 3.6s forwards}
.fanfare h2{font-size:1.9rem;color:#2a2410}.fanfare .big{font-family:"Fraunces",Georgia,serif;font-size:3rem;line-height:1;margin:.2rem 0}
.fanfare .sub{font-size:.95rem;opacity:.8}
.fanfare .card{display:inline-flex;width:56px;height:78px;font-size:1.6rem;margin:.3rem 0;box-shadow:0 4px 12px rgba(0,0,0,.3)}.fanfare .card small{font-size:1rem}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}}
@keyframes fade{to{opacity:0;transform:scale(.9)}}
.spark{position:absolute;font-size:1.6rem;animation:spark 1.4s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#vid{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:6px 10px;overflow-x:auto;min-height:0}
#vid:empty{display:none}
.tile{position:relative;flex:none;width:78px;height:104px;border-radius:10px;overflow:hidden;background:#111;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.app.table ~ #vid .tile, body.tbl .tile{width:150px;height:112px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.me video{transform:scaleX(-1)}
.tile .nm{position:absolute;left:0;right:0;bottom:0;font-size:.68rem;padding:2px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mic{position:absolute;top:4px;right:4px;font-size:.7rem;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 4px}
.vctl{flex:none;display:flex;flex-direction:column;gap:5px;margin-left:auto}
.vctl button{padding:.45rem .7rem;font-size:.82rem;border-radius:9px}
body.hasvid .app{padding-top:128px}
body.hasvid.tbl .app{padding-top:136px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="vid"></div>
<div id="banner"></div>
<div class="conn" id="conn"></div>
<script>
(function(){
const SUITS=['S','H','D','C'];
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const NAME={S:'spades',H:'hearts',D:'diamonds',C:'clubs'};
const RED={S:false,H:true,D:true,C:false};
const RN={1:'A',11:'J',12:'Q'};
const WORD={1:'ace',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'jack',12:'queen'};
const rname=r=>RN[r]||String(r);
const cs=c=>rname(c.r)+SYM[c.s];
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const CLAIM_MS=5000;
const get=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const set=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

let pid=get('fk-pid'); if(!pid){ pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36); set('fk-pid',pid); }
const qs=new URLSearchParams(location.search);
let room=(qs.get('room')||get('fk-room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
let mode=qs.get('mode')||get('fk-mode')||'';
let nick=get('fk-nick'); let hints=get('fk-hints')==='1'; let sfxOn=get('fk-sfx')!=='0', winOn=get('fk-win')!=='0', musicOn=get('fk-music')==='1', lastLeft=-1;
let S=null, prev=null, ws=null, timer=null, bannerTimer=null, lastEvent=0, draft={suits:[],total:10}, viewMsg='', claimSeen=0, dealSeen=0, reconnectIn=800;
const betsOf=d=>{ const o={}; if(!d.suits.length) return o; const each=d.total/d.suits.length; d.suits.forEach(x=>o[x]=each); return o; };
const betsText=b=>Object.keys(b).map(x=>'$'+b[x]+' '+SYM[x]).join(' + ');
const sameBets=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const app=document.getElementById('app'), connEl=document.getElementById('conn');
const isTbl=()=>mode==='table'||mode==='both';

/* ---------- helpers ---------- */
const pidx=(st,id)=>st.players.findIndex(p=>p.id===id);
const pname=(st,i)=>st.players[i]?st.players[i].name:'?';
const swapOrder=(st,k)=>(st.first+k)%st.players.length;
function leadOptions(st,i){
  const h=st.players[i].hand||[], want=st.colour; const suitsOf=col=>SUITS.filter(s=>(col==='red')===RED[s]);
  const suits=want?suitsOf(want):SUITS; const avail=suits.filter(s=>h.some(c=>c.s===s));
  return {opts:avail.map(s=>({s,low:h.filter(c=>c.s===s).sort((a,b)=>a.r-b.r)[0]}))};
}
function tailLen(st){ const w=st.run[st.run.length-1].who; let n=0; for(let i=st.run.length-1;i>=0&&st.run[i].who===w;i--) n++; return n; }
function newCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }

/* ---------- connection ---------- */
function connect(){
  if(!room||!mode) return;
  if(ws){ try{ws.onclose=null;ws.close();}catch(e){} }
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${room}?pid=${encodeURIComponent(pid)}&role=${mode==='both'?'hand':mode}`);
  connEl.textContent='connecting…';
  ws.onopen=()=>{ connEl.textContent='● live'; reconnectIn=800; ws.send(JSON.stringify({t:'hello'})); if(rtc.on) ws.send(JSON.stringify({t:'video',on:true})); if(isTbl()) loadIce(); };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.t==='err'){ viewMsg=m.msg; render(); setTimeout(()=>{viewMsg='';render();},2500); return; }
    if(m.t==='rtc'){ onRtc(m.from,m.data); return; }
    if(m.t==='state'){ prev=S; S=m.s; onState(S,prev); render(); syncPeers(); } };
  ws.onclose=()=>{ connEl.textContent='reconnecting…'; setTimeout(connect,reconnectIn); reconnectIn=Math.min(reconnectIn*1.6,8000); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
function sendMsg(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function onState(st,old){
  if(st.phase==='claim'&&(!old||old.phase!=='claim'||old.run.length!==st.run.length||old.runSuit!==st.runSuit)) claimSeen=Date.now();
  if(mode!=='table'&&st.phase==='ante'&&(!old||old.phase!=='ante')) draft={suits:[],total:10};
  if(st.phase==='ante'&&st.dealAt&&(!old||!old.dealAt)) dealSeen=Date.now()+(st.dealAt-st.serverNow);
  if(st.event&&st.event.at!==lastEvent){ if(old) showBanner(st); lastEvent=st.event.at; }
  try{ soundsFor(st,old); }catch(e){}
  announce(st,old);
}
function showBanner(st){
  const e=st.event, b=document.getElementById('banner'); const name=pname(st,e.who), me=st.players[e.who]&&st.players[e.who].id===pid&&mode!=='table';
  const sparks=Array.from({length:14},(_,i)=>{ const a=i/14*Math.PI*2, d=120+Math.random()*120; return `<span class="spark" style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;animation-delay:${Math.random()*.3}s">${['✨','⭐','💰','🎉'][i%4]}</span>`; }).join('');
  const body=e.t==='queen'
    ?`<h2>${me?'You':esc(name)} took the King of ${NAME[e.suit]}!</h2>${cardHTML({s:e.suit,r:12})}<div class="big">+$${e.won}</div><div class="sub">played the Queen of ${NAME[e.suit]}</div>`
    :`<h2>${me?'You are':esc(name)+' is'} out of cards!</h2><div class="big">+$${e.won}</div><div class="sub">takes the centre</div>`;
  b.innerHTML=`<div class="fanfare" style="position:relative">${sparks}${body}</div>`;
  if(winOn){ try{ chime(e.t==='out'); coins(e.t==='out'?28:14, .35); }catch(x){} }
  if(bannerTimer) clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>{ b.innerHTML=''; },4300);
}

/* ---------- sounds (all synthesised, nothing to download) ---------- */
let actx=null;
function ac(){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; actx=actx||new AC(); if(actx.state==='suspended') actx.resume().catch(()=>{}); return actx; }
function tone(f,t0,dur,vol,type){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.001,t0+dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05); }
function noise(t0,dur,vol,hp){ const a=ac(); if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1200; const g=a.createGain(); g.gain.value=vol; src.connect(f).connect(g).connect(a.destination); src.start(t0); }
function chime(big){ const a=ac(); if(!a) return; const t=a.currentTime; const notes=big?[523,659,784,1047,1319]:[659,880,1175]; notes.forEach((f,i)=>tone(f,t+i*.12,.5,.22)); }
function coins(n,vol){ const a=ac(); if(!a) return; const t=a.currentTime+.15; for(let i=0;i<n;i++){ const at=t+i*.045+Math.random()*.03, f=2400+Math.random()*2600; tone(f,at,.12,vol*(.5+Math.random()*.5),'sine'); tone(f*1.5,at,.06,vol*.25,'square'); } }
const sfx={
  card(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; noise(t,.07,.5,900); tone(180,t+.01,.06,.12,'sine'); },
  deal(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; for(let i=0;i<10;i++) noise(t+i*.055,.04,.35,1500); },
  stop(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; tone(140,t,.25,.3,'sine'); noise(t,.12,.25,300); },
  lead(){ if(!sfxOn) return; const a=ac(); if(!a) return; const t=a.currentTime; tone(880,t,.12,.18,'sine'); tone(1175,t+.14,.18,.18,'sine'); },
  tap(){ if(!sfxOn) return; const a=ac(); if(!a) return; tone(1400,a.currentTime,.05,.1,'square'); },
  beep(last){ if(!sfxOn) return; const a=ac(); if(!a) return; tone(last?1320:990,a.currentTime,last?.18:.09,.14,'square'); },
  bet(){ if(!sfxOn) return; const a=ac(); if(!a) return; coins(3,.2); }
};
function soundsFor(st,old){
  if(!old) return;
  const runGrew=st.run.length>old.run.length&&(st.phase==='claim'||st.phase==='play'||st.phase==='over');
  if(runGrew) sfx.card();
  if(st.phase==='swap'&&old.phase==='ante') sfx.deal();
  if(st.phase==='play'&&old.phase==='claim'&&st.run.length===old.run.length) sfx.stop();
  if(st.phase==='play'&&(old.phase!=='play'||old.leader!==st.leader)&&mode!=='table'&&st.players[st.leader]&&st.players[st.leader].id===pid) sfx.lead();
  if(st.phase==='ante'&&old.phase==='ante'&&st.players.filter(p=>p.placed).length>old.players.filter(p=>p.placed).length&&!(mode!=='table'&&st.players.some(p=>p.id===pid&&p.placed&&!old.players.find(o=>o.id===pid&&o.placed)))) sfx.bet();
}

/* ---------- background music: an original lo-fi loop, generated on the device ---------- */
const music={on:false,timer:null,step:0,next:0,master:null,delay:null};
const CHORDS=[[57,60,64,67],[62,65,69,72],[55,59,62,65],[60,64,67,71]]; // Am7 Dm7 G7 Cmaj7 (MIDI)

  const g=a.createGain(); g.gain.value=0; g.connect(a.destination); g.gain.linearRampToValueAtTime(.55,a.currentTime+2); music.master=g;
  const d=a.createDelay(1); d.delayTime.value=.36; const fb=a.createGain(); fb.gain.value=.32; const df=a.createBiquadFilter(); df.type='lowpass'; df.frequency.value=1800; d.connect(df).connect(fb).connect(d); d.connect(g); music.delay=d;
  // vinyl crackle bed
  const n=a.sampleRate*2, buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=Math.random()<.004?(Math.random()*2-1)*.6:(Math.random()*2-1)*.02;

}
function musicStop(){ if(!music.on) return; music.on=false; clearInterval(music.timer); const a=ac(); if(music.master){ const g=music.master; g.gain.linearRampToValueAtTime(0,a.currentTime+1.2); setTimeout(()=>{ try{ g.disconnect(); music.crackle.stop(); }catch(e){} },1400); } }
function musicTick(){
  const a=ac(); if(!a||!music.on) return; const bpm=82, sixteenth=60/bpm/4;
  while(music.next<a.currentTime+.35){
    const s=music.step, bar=Math.floor(s/16), inBar=s%16, swing=(inBar%2)?sixteenth*.18:0, t=music.next+swing, g=music.master, chord=CHORDS[bar%4];
    if(inBar===0){ chord.forEach((m,i)=>{ const o=a.createOscillator(), og=a.createGain(), f=a.createBiquadFilter(); o.type=i%2?'triangle':'sawtooth'; o.frequency.value=mhz(m); o.detune.value=(i-1.5)*6; f.type='lowpass'; f.frequency.value=700; og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(.045,t+.35); og.gain.setValueAtTime(.045,t+sixteenth*13); og.gain.linearRampToValueAtTime(0,t+sixteenth*16); o.connect(f).connect(og).connect(g); o.start(t); o.stop(t+sixteenth*16.2); }); }
    if(inBar===0||inBar===8||(inBar===11&&bar%2)){ const o=a.createOscillator(), og=a.createGain(); o.type='sine'; o.frequency.value=mhz(chord[0]-24); og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(.22,t+.02); og.gain.exponentialRampToValueAtTime(.001,t+sixteenth*6); o.connect(og).connect(g); o.start(t); o.stop(t+sixteenth*6.5); }
    if(inBar===0||inBar===8||inBar===10){ const o=a.createOscillator(), og=a.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.12); og.gain.setValueAtTime(.5,t); og.gain.exponentialRampToValueAtTime(.001,t+.22); o.connect(og).connect(g); o.start(t); o.stop(t+.25); }
    if(inBar===4||inBar===12){ const nb=a.createBuffer(1,a.sampleRate*.15,a.sampleRate), c=nb.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,2); const ns=a.createBufferSource(); ns.buffer=nb; const nf=a.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1800; nf.Q.value=.7; const ng=a.createGain(); ng.gain.value=.22; ns.connect(nf).connect(ng).connect(g); ns.start(t); }
    if(inBar%2===0||Math.random()<.35){ const nb=a.createBuffer(1,a.sampleRate*.04,a.sampleRate), c=nb.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=(Math.random()*2-1)*(1-i/c.length); const ns=a.createBufferSource(); ns.buffer=nb; const nf=a.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=7000; const ng=a.createGain(); ng.gain.value=inBar%4===2?.12:.07; ns.connect(nf).connect(ng).connect(g); ns.start(t); }
    if(inBar%2===0&&Math.random()<.28){ const m=PENTA[Math.floor(Math.random()*PENTA.length)]; const o=a.createOscillator(), og=a.createGain(); o.type='triangle'; o.frequency.value=mhz(m); og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(.09,t+.03); og.gain.exponentialRampToValueAtTime(.001,t+sixteenth*3); o.connect(og).connect(g); o.connect(og).connect(music.delay); o.start(t); o.stop(t+sixteenth*3.2); }

}

function say(t){ try{ if(!isTbl()||!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; speechSynthesis.speak(u);}catch(e){} }
function announce(st,old){
  if(!old||st.v===old.v) return;
  if(st.phase==='claim'&&st.run.length>(old.phase==='claim'&&old.runSuit===st.runSuit?old.run.length:0)){
    const n=tailLen(st); const tail=st.run.slice(st.run.length-n);
    say(tail.map(x=>WORD[x.c.r]+' of '+NAME[x.c.s]).join(', ')+'. Who has the '+WORD[st.nextRank]+'?');
  } else if(st.phase==='play'&&old.phase!=='play'){ say((st.note?st.note+' ':'')+pname(st,st.leader)+', your lowest '+(st.colour||'card')); }
  else if(st.phase==='over'&&old.phase!=='over'){ say(st.winner?(st.note?st.note+' ':'')+pname(st,st.winner.idx)+' is out of cards and takes the centre, '+st.winner.won+' dollars.':st.note); }
  else if(st.phase==='ante'&&old.phase!=='ante'){ say('Place your bets.'); }
  else if(st.phase==='swap'&&old.phase==='ante'){ say('Cards are dealt. '+pname(st,swapOrder(st,0))+', keep or swap?'); }

/* ---------- video: WebRTC mesh between everyone at this table ---------- */
const rtc={on:false,mic:false,stream:null,peers:{},ice:{iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]},iceLoaded:false};
const vidEl=document.getElementById('vid');
async function loadIce(){ if(rtc.iceLoaded) return; try{ const r=await fetch('/ice'); if(r.ok){ rtc.ice=await r.json(); } }catch(e){} rtc.iceLoaded=true; }
async function startVideo(){
  if(rtc.on) return;
  try{ rtc.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:320},height:{ideal:240},frameRate:{ideal:15},facingMode:'user'},audio:true}); }
  catch(e){ viewMsg='Camera or microphone not available: '+(e.message||e.name); render(); return; }
  rtc.stream.getAudioTracks().forEach(t=>t.enabled=rtc.mic);
  rtc.on=true; await loadIce();
  Object.keys(rtc.peers).forEach(closePeer); sendMsg({t:'video',on:true}); syncPeers(); renderVideo();
}
function stopVideo(){ if(!rtc.on) return; rtc.on=false; rtc.stream.getTracks().forEach(t=>t.stop()); rtc.stream=null; Object.keys(rtc.peers).forEach(closePeer); sendMsg({t:'video',on:false}); syncPeers(); renderVideo(); }
function toggleMic(){ rtc.mic=!rtc.mic; if(rtc.stream) rtc.stream.getAudioTracks().forEach(t=>t.enabled=rtc.mic); renderVideo(); }
function iParticipate(){ return rtc.on||isTbl(); }
function wantPeer(p){ return p.sid!==S.sid && (p.video||p.role==='table') && (p.video||rtc.on); }
function syncPeers(){
  if(!S||!S.sid) return;
  const want=new Set(iParticipate()?S.peers.filter(wantPeer).map(p=>p.sid):[]);
  Object.keys(rtc.peers).forEach(sid=>{ if(!want.has(sid)) closePeer(sid); });
  want.forEach(sid=>{ if(!rtc.peers[sid]) makePeer(sid); });
  renderVideo();
}
function makePeer(sid){
  const pc=new RTCPeerConnection(rtc.ice); const p={pc,polite:S.sid>sid,stream:null,making:false,ignore:false}; rtc.peers[sid]=p;
  if(rtc.stream) rtc.stream.getTracks().forEach(t=>pc.addTrack(t,rtc.stream)); else { pc.addTransceiver('video',{direction:'recvonly'}); pc.addTransceiver('audio',{direction:'recvonly'}); }
  pc.onnegotiationneeded=async()=>{ try{ p.making=true; await pc.setLocalDescription(); sendMsg({t:'rtc',to:sid,data:{description:pc.localDescription}}); }catch(e){ console.warn(e); } finally{ p.making=false; } };
  pc.onicecandidate=({candidate})=>{ if(candidate) sendMsg({t:'rtc',to:sid,data:{candidate}}); };
  pc.ontrack=ev=>{ p.stream=ev.streams[0]||new MediaStream([ev.track]); renderVideo(); };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed'){ closePeer(sid); setTimeout(syncPeers,1500); } renderVideo(); };
  return p;
}
function closePeer(sid){ const p=rtc.peers[sid]; if(!p) return; try{p.pc.close();}catch(e){} delete rtc.peers[sid]; }
async function onRtc(from,data){
  if(!S||!S.peers.some(x=>x.sid===from)) return;
  let p=rtc.peers[from]; if(!p){ if(!iParticipate()) return; await loadIce(); p=makePeer(from); }
  const pc=p.pc;
  try{
    if(data.description){
      const collision=data.description.type==='offer'&&(p.making||pc.signalingState!=='stable');
      p.ignore=!p.polite&&collision; if(p.ignore) return;
      await pc.setRemoteDescription(data.description);
      if(data.description.type==='offer'){ await pc.setLocalDescription(); sendMsg({t:'rtc',to:from,data:{description:pc.localDescription}}); }
    } else if(data.candidate){ try{ await pc.addIceCandidate(data.candidate); }catch(e){ if(!p.ignore) console.warn(e); } }
  }catch(e){ console.warn(e); }
}
function renderVideo(){
  const tiles=[]; document.body.classList.toggle('tbl',isTbl());
  if(rtc.on) tiles.push({key:'me',stream:rtc.stream,name:'You',me:true});
  for(const sid in rtc.peers){ const peer=S&&S.peers.find(x=>x.sid===sid); if(peer&&peer.video&&rtc.peers[sid].stream) tiles.push({key:sid,stream:rtc.peers[sid].stream,name:peer.name}); }
  const keep=new Set(tiles.map(t=>t.key));
  [...vidEl.querySelectorAll('.tile')].forEach(el=>{ if(!keep.has(el.dataset.key)) el.remove(); });
  tiles.forEach(t=>{ let el=vidEl.querySelector(`.tile[data-key="${t.key}"]`);
    if(!el){ el=document.createElement('div'); el.className='tile'+(t.me?' me':''); el.dataset.key=t.key; const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline',''); v.muted=!!t.me; el.appendChild(v); const n=document.createElement('div'); n.className='nm'; el.appendChild(n); vidEl.insertBefore(el,vidEl.querySelector('.vctl')); }
    const v=el.querySelector('video'); if(v.srcObject!==t.stream){ v.srcObject=t.stream; v.play().catch(()=>{}); } el.querySelector('.nm').textContent=t.name; });
  let ctl=vidEl.querySelector('.vctl');
  const showCtl=mode!=='table'&&room&&S;
  if(showCtl){ if(!ctl){ ctl=document.createElement('div'); ctl.className='vctl'; vidEl.appendChild(ctl); }
    ctl.innerHTML=rtc.on?`<button class="ghost" id="micbtn">${rtc.mic?'🎤 Mic on':'🔇 Mic off'}</button><button class="ghost" id="vidoff">Leave video</button>`:`<button id="vidon">📷 Join video</button>`;
    const q=s=>ctl.querySelector(s); if(q('#vidon')) q('#vidon').onclick=startVideo; if(q('#vidoff')) q('#vidoff').onclick=stopVideo; if(q('#micbtn')) q('#micbtn').onclick=toggleMic;
  } else if(ctl) ctl.remove();
  document.body.classList.toggle('hasvid',vidEl.children.length>0);
}

    main=`<h2>${esc(pname(st,i))}: keep or swap?</h2><p class="muted">${st.swapIdx+1} of ${st.players.length} asked. The spare hand goes to the first player who takes it.</p>`;
  } else if(st.phase==='play'){
    main=`<div class="pile">${pileHTML(st,false)}</div>${noteHTML(st)}<div class="call">${esc(pname(st,st.leader))}, your lowest ${st.colour||'card'}</div>`;
  } else if(st.phase==='claim'){
    main=`<div class="pile">${pileHTML(st,true)}</div>${noteHTML(st)}<div class="call">Who has the ${cs({s:st.runSuit,r:st.nextRank})}?</div><div class="count" id="count">${fmtSec((st.claimMs||CLAIM_MS)/1000)}</div>`;
  } else if(st.phase==='over'){
    const left=SUITS.reduce((a,s)=>a+st.kings[s],0);
    main=`<div class="pile">${pileHTML(st,false)}</div><div class="panel center">${st.winner?`<h2>${esc(pname(st,st.winner.idx))} is out of cards</h2><p>They take the $${st.winner.won} from the centre.</p>${noteHTML(st,'small')}<p class="small muted">${left?`$${left} stays on the kings for next game.`:'The kings are empty.'}</p>`:`<h2>Game over, nobody out</h2><p>${esc(st.note)}</p><p class="small muted">$${st.pot} stays in the centre${left?` and $${left} on the kings`:''} for next game.</p>`}</div>
    ${host?`<button class="big" id="nextgame">Bets for game ${st.game+1}</button><div class="row" style="margin-top:8px"><button class="ghost small" id="addbot" ${st.players.length>=8?'disabled':''}>Add a bot</button><button class="ghost small" id="removebot" ${st.players.some(p=>p.bot)?'':'disabled'}>Remove a bot</button></div>${timerPicker(st)}`:''}`;
  }
  return `<div class="tgrid"><div>${kingsHTML(st)}${main}</div><div>${scoresHTML(st)}${(st.phase==='lobby'||st.phase==='over')?boardHTML(st,host):''}${host&&(st.phase!=='lobby'||st.players.length)?`<button class="ghost small" id="reset" style="width:100%">Clear the table</button>`:''}</div></div>`;
}
function pileHTML(st,live){
  if(!st.run.length) return `<div class="wait" style="padding-top:110px">${st.game?'Table is clear':''}</div>`;
  const n=st.run.length, newest=live?tailLen(st):0;
  return st.run.map((x,i)=>{ const ang=((i*47)%21)-10, dx=(i-(n-1)/2)*26; return `<div style="position:absolute;inset:0;transform:translate(${dx}px,0) rotate(${ang}deg)">${cardHTML(x.c,'lg who'+(i>=n-newest?' new':''),pname(st,x.who))}</div>`; }).join('');
}
/* --- hand (phone) --- */
function handHTML(st){ return kingsHTML(st)+handMain(st)+scoresHTML(st)+((st.phase==='lobby'||st.phase==='over')?boardHTML(st,st.host):''); }
function handMain(st){
  const i=pidx(st,pid); const p=i>=0?st.players[i]:null; const hand=p&&p.hand?p.hand:[];
  let main='';
  if(!p){
    if(st.phase==='lobby'||st.phase==='over') main=`<h2>Join table ${esc(room)}</h2><input id="nick" placeholder="Your name at the table" value="${esc(nick)}" maxlength="18"><button class="big" id="join" ${st.players.length>=8?'disabled':''}>Join game</button>${st.players.length?`<p class="small muted">At the table: ${st.players.map(x=>esc(x.name)).join(', ')}</p>`:''}`;
    else main=`<div class="wait">A game is in progress at table ${esc(room)}. You can join when it finishes.</div>`;
    return main;
  }
  if(st.phase==='lobby'){ main=`<div class="wait"><h2>You're in, ${esc(p.name)}</h2><p class="muted">Waiting for the table to start the game.</p>${st.host?`<button id="start" ${st.players.length<2?'disabled':''}>Start the game</button> <button class="ghost" id="addbot" ${st.players.length>=8?'disabled':''}>Add a bot</button> `:''}<button class="ghost" id="leave">Leave</button>${st.host?timerPicker(st):`<p class="small muted">Time to play the next card: ${fmtSec((st.claimMs||5000)/1000)}${st.claimMs>=60000?' min':' s'}</p>`}</div>`; }
  else if(st.phase==='ante'){
    if(p.placed&&!draft.suits.length){ draft.suits=Object.keys(p.bets); draft.total=p.bet; }
    const max=Math.max(10,Math.floor(p.balance/20)*10); const step=draft.suits.length===2?20:10;
    if(draft.total>max) draft.total=Math.max(step,Math.floor(max/step)*step); if(draft.total<step) draft.total=step; if(draft.total%step) draft.total=Math.ceil(draft.total/step)*step;
    const bets=betsOf(draft), each=draft.suits.length?draft.total/draft.suits.length:0, dirty=!p.placed||!sameBets(bets,p.bets);
    main=`<h2>${p.placed?'Your bet is in':'Your bet'}</h2><p class="muted small">You have $${p.balance}. Tap a king, or two kings to split the stake; the same again goes in the centre. ${p.placed?'You can change it until the cards are dealt.':''}</p>
      <div class="kbtns">${SUITS.map(s=>`<button class="${RED[s]?'red':''} ${draft.suits.includes(s)?'on':''}" data-king="${s}">${SYM[s]}${draft.suits.includes(s)?`<div class="small" style="font-family:-apple-system,sans-serif;font-weight:600">$${each}</div>`:''}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="ghost" data-bet="-${step}" style="flex:0 0 56px">−</button><div class="center"><span class="serif" style="font-size:1.8rem">$${draft.total}</span><div class="small muted">${draft.suits.length?betsText(bets):'on a king'} + $${draft.total} centre</div></div><button class="ghost" data-bet="${step}" style="flex:0 0 56px">+</button></div>
      <button class="big" id="place" ${draft.suits.length&&dirty&&p.balance>=2*draft.total?'':'disabled'}>${p.placed?(dirty?'Change my bet':'Bet placed'):'Place bet'}</button>
      ${st.dealAt?`<p class="center small muted">All bets are in — dealing in <span class="dealin" id="dealin">15</span> s</p>`:'<p class="center small muted">Waiting for everyone to bet…</p>'}
      ${st.host&&st.canDeal?`<button class="big ghost" id="deal">Deal the cards now</button>`:''}`;
  }
  else if(st.phase==='swap'){
    const turn=swapOrder(st,st.swapIdx);
    if(turn===i) main=`<h2>Keep or swap?</h2><p class="muted small">Your ${hand.length} cards. The spare hand (${st.spareCount} cards) stays face down until someone takes it.</p>${handView(hand)}<div class="row"><button class="ghost" id="keep">Keep these</button><button id="swap">Swap for the spare</button></div>`;
    else main=`${handView(hand)}<div class="wait">${esc(pname(st,turn))} is deciding whether to swap…</div>`;
  }
  else if(st.phase==='play'){
    const note=noteHTML(st,'small');
    if(st.leader===i){ const {opts}=leadOptions(st,i); const leads={}; opts.forEach(o=>leads[o.s]=o.low.r);
      main=`${miniRun(st)}${note}<div class="leadcall">Your lead: ${st.colour?`lowest <span class="col ${st.colour}">${st.colour}</span>`:'lowest card of <span class="col">any suit</span>'}</div><p class="muted small center">${st.colour?`Tap your lowest ${st.colour} card.`:'First lead of the game: tap any of your lowest cards.'}</p>${handView(hand,leads)}`; }
    else main=`${miniRun(st)}${note}<p class="center">${esc(pname(st,st.leader))} to lead their lowest ${st.colour||'card'}.</p>${handView(hand)}`;
  }
  else if(st.phase==='claim'){
    const need={s:st.runSuit,r:st.nextRank}; const have=hand.some(c=>c.s===need.s&&c.r===need.r);
    main=`${miniRun(st,true,need)}${noteHTML(st,'small')}
      ${hints&&have?`<button class="huge" id="claim">I've got the ${cs(need)}!</button><div class="count" id="count">${fmtSec((st.claimMs||CLAIM_MS)/1000)}</div>`:`<p class="center">Got it? Tap the card in your hand. <span class="serif" id="count">${fmtSec((st.claimMs||CLAIM_MS)/1000)}</span></p>`}
      ${handView(hand,null,{need,hint:hints})}`;
  }
  else if(st.phase==='over'){
    main=`${miniRun(st)}<div class="wait">${st.winner?`<h2>${st.winner.idx===i?'You take the centre!':esc(pname(st,st.winner.idx))+' is out of cards'}</h2><p class="muted">$${st.winner.won} from the centre. Waiting for the next game.</p>`:`<h2>Game over, nobody out</h2><p class="muted">${esc(st.note)} $${st.pot} stays in the centre for next game.</p>`}${st.host?`<button id="nextgame">Next game</button>`:''}</div>`;
  }
  return main;
}
function miniRun(st,live,need){
  if(!st.run.length) return `<div class="minirun"><span class="muted small">Table is clear</span></div>`;
  const shown=st.run.slice(-5), n=shown.length;
  const fan=shown.map((x,k)=>{ const ang=(k%2?9:-9); const left=n>1?`calc(${k} * (100% - 40px) / ${n-1})`:'calc(50% - 20px)'; return `<div style="position:absolute;top:0;bottom:0;left:${left};transform:rotate(${ang}deg)">${cardHTML(x.c,k===n-1?'last':'')}</div>`; }).join('');
  return `<div class="minirun"><div class="fan">${fan}<div class="lbl">last ${n} played</div></div>${need?`<div style="position:relative;flex:none">${cardHTML(need,'ghost')}<div class="lbl">wanted</div></div>`:''}</div>`;
}
function handView(h,leads,claim){
  return `<div class="hand">${SUITS.map(s=>{const cards=h.filter(c=>c.s===s); if(!cards.length) return ''; return `<div class="suitrow"><span class="tag ${RED[s]?'red':''}">${SYM[s]}</span><div class="cards">${cards.map(c=>{
    if(leads&&leads[s]===c.r) return `<button class="cardbtn" data-lead="${s}">${cardHTML(c,'lead')}</button>`;
    if(claim){ const match=c.s===claim.need.s&&c.r===claim.need.r; return `<button class="cardbtn" data-claim="${c.s}${c.r}">${cardHTML(c,match&&claim.hint?'lead':'')}</button>`; }
    return cardHTML(c); }).join('')}</div></div>`;}).join('')}</div>`;
}
function bind(){
  const q=s=>app.querySelector(s);
  if(q('#newtable')) q('#newtable').onclick=()=>{ room=newCode(); mode='table'; set('fk-room',room); set('fk-mode',mode); say(' '); S=null; render(); connect(); };
  if(q('#newboth')) q('#newboth').onclick=()=>{ room=newCode(); mode='both'; set('fk-room',room); set('fk-mode',mode); say(' '); S=null; render(); connect(); };
  if(q('#both')) q('#both').onclick=()=>{ stopVideo(); Object.keys(rtc.peers).forEach(closePeer); mode='both'; set('fk-mode',mode); S=null; render(); renderVideo(); connect(); };
  if(q('#joinroom')) q('#joinroom').onclick=()=>{ const c=q('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length<3){ q('#code').focus(); return; } room=c; mode='hand'; set('fk-room',room); set('fk-mode',mode); S=null; render(); connect(); };
  if(q('#switch')) q('#switch').onclick=()=>{ stopVideo(); Object.keys(rtc.peers).forEach(closePeer); mode=mode==='hand'?'table':mode==='both'?'table':'hand'; set('fk-mode',mode); S=null; render(); renderVideo(); connect(); };
  if(q('#leaveRoom')) q('#leaveRoom').onclick=()=>{ stopVideo(); Object.keys(rtc.peers).forEach(closePeer); if(ws){ws.onclose=null;ws.close();} ws=null; S=null; mode=''; set('fk-mode',''); render(); renderVideo(); };
  if(q('#start')) q('#start').onclick=()=>sendMsg({t:'start'}); if(q('#sharelink')) q('#sharelink').onclick=async()=>{ const b=q('#sharelink'), link=b.dataset.link; try{ if(navigator.share){ await navigator.share({title:'Four Kings, table '+room,text:'Join my Four Kings table',url:link}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } try{ await navigator.clipboard.writeText(link); b.textContent='Copied!'; }catch(e){ prompt('Copy this link:',link); } setTimeout(()=>{ if(b.isConnected) b.textContent='🔗 Share join link'; },1800); };
  if(q('#addbot')) q('#addbot').onclick=()=>sendMsg({t:'addbot'});
  app.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>sendMsg({t:'settings',claimMs:+b.dataset.timer}));
  if(q('#removebot')) q('#removebot').onclick=()=>sendMsg({t:'removebot'});
  if(q('#clearboard')) q('#clearboard').onclick=()=>{ if(confirm('Reset the season scoreboard?')) sendMsg({t:'clearboard'}); };
  if(q('#reset')) q('#reset').onclick=()=>{ if(confirm('Clear the table for everyone?')) sendMsg({t:'reset'}); };
  if(q('#nextgame')) q('#nextgame').onclick=()=>sendMsg({t:'next'});
  if(q('#join')) q('#join').onclick=()=>{ nick=q('#nick').value.trim().slice(0,18)||'Player'; set('fk-nick',nick); sendMsg({t:'join',name:nick}); };
  if(q('#leave')) q('#leave').onclick=()=>sendMsg({t:'leave'});
  app.querySelectorAll('[data-king]').forEach(b=>b.onclick=()=>{ const s=b.dataset.king; if(draft.suits.includes(s)) draft.suits=draft.suits.filter(x=>x!==s); else if(draft.suits.length<2) draft.suits.push(s); else draft.suits=[draft.suits[1],s]; if(draft.suits.length===2&&draft.total<20) draft.total=20; render(); });
  app.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ draft.total=Math.max(10,draft.total+(+b.dataset.bet)); render(); });
  if(q('#place')) q('#place').onclick=()=>{ q('#place').disabled=true; if(sfxOn){ try{ coins(6,.35); }catch(e){} } sendMsg({t:'bet',bets:betsOf(draft)}); };
  if(q('#deal')) q('#deal').onclick=()=>sendMsg({t:'deal'});
  if(q('#keep')) q('#keep').onclick=()=>sendMsg({t:'swap',swap:false});
  if(q('#swap')) q('#swap').onclick=()=>sendMsg({t:'swap',swap:true});
  app.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{ b.disabled=true; sfx.tap(); sendMsg({t:'lead',suit:b.dataset.lead}); });
  if(q('#claim')) q('#claim').onclick=()=>{ q('#claim').disabled=true; sendMsg({t:'claim'}); };
  app.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{ if(!S||S.phase!=='claim') return; const need=S.runSuit+S.nextRank; if(b.dataset.claim===need){ b.disabled=true; sfx.tap(); sendMsg({t:'claim'}); } else { viewMsg='Not that one.'; render(); setTimeout(()=>{ if(viewMsg==='Not that one.'){ viewMsg=''; render(); } },1200); } });
  if(q('#hints')) q('#hints').onclick=()=>{ hints=!hints; set('fk-hints',hints?'1':'0'); render(); };
  if(q('#sfx')) q('#sfx').onclick=()=>{ sfxOn=!sfxOn; set('fk-sfx',sfxOn?'1':'0'); if(sfxOn) sfx.card(); render(); };
  if(q('#musicbtn')) q('#musicbtn').onclick=()=>{ musicOn=!musicOn; set('fk-music',musicOn?'1':'0'); try{ musicOn?musicStart():musicStop(); }catch(e){} render(); };
  if(q('#winsnd')) q('#winsnd').onclick=()=>{ winOn=!winOn; set('fk-win',winOn?'1':'0'); if(winOn){ try{ chime(false); coins(10,.3); }catch(e){} } render(); };
}

['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ try{ ac(); if(musicOn&&!music.on&&room&&mode) musicStart(); }catch(e){} },{passive:true}));
if(qs.get('room')&&qs.get('mode')){ set('fk-room',room); set('fk-mode',mode); }
render();
if(room&&mode) connect();
})();
</script>
