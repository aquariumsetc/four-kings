<style>

}
@media (prefers-color-scheme:dark){ :root{ --felt:#163f2a; --felt-deep:#0f2b1d; --bg:#163f2a; color-scheme:dark; } }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}

.muted{opacity:.78}.small{font-size:.86rem}
.row{display:flex;gap:.6rem;align-items:center}.row>*{flex:1}
.notice{background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.5);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0}

.app:not(.table) .spot .k{max-width:30px;font-size:.78rem;border-radius:4px;gap:0;aspect-ratio:5/7}
.app:not(.table) .coins{margin-top:2px;font-size:.78rem}
.app:not(.table) .pot .n{font-size:1.3rem}.app:not(.table) .pot .l{font-size:.68rem}
.card{width:38px;height:52px;border-radius:5px;background:var(--ivory);color:var(--ink);font-family:"Fraunces",Georgia,serif;font-size:1.05rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.4);position:relative}

.hand{display:flex;flex-direction:column;gap:6px;margin:.8rem 0}
.suitrow{display:flex;align-items:center;gap:4px;min-height:52px}

.cards{display:flex;gap:4px;flex-wrap:wrap}
button.cardbtn{padding:0;background:none;border-radius:5px}
.tgrid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media (max-width:760px){.tgrid{grid-template-columns:1fr}}
/* table + your cards on one screen: cards right under the table, side panel after (phones) or alongside (wide) */
.tgrid.withhand{grid-template-areas:"round side" "hand side"}.tgrid.withhand>.tl-round{grid-area:round}.tgrid.withhand>.tl-side{grid-area:side}.tgrid.withhand>.tl-hand{grid-area:hand}
@media (max-width:760px){.tgrid.withhand{grid-template-areas:"round" "hand" "side"}}

@media (prefers-reduced-motion:no-preference){.pile .card.new{animation:land .45s cubic-bezier(.2,.9,.3,1.2)}@keyframes land{from{transform:translate(0,-320px) rotate(-30deg) scale(1.3);opacity:0}}}

.kbtns{display:flex;gap:6px}.kbtns button{flex:1;padding:.7rem 0;font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:700;background:var(--btn-2);color:var(--fg)}

.center{text-align:center}
.wait{text-align:center;padding:2rem 0;opacity:.85}
.tick{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--brass);margin-right:6px}
.codebig{font-family:"Fraunces",Georgia,serif;font-size:3rem;letter-spacing:.25em;color:var(--brass);text-align:center;line-height:1}

.qr{background:#fbf7ec;padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{display:block}
.settings .srow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;border-top:1px solid rgba(251,247,236,.1)}
.settings button{padding:.35rem .6rem}
.nudge{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.04);color:var(--brass)}}
#sndhint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(0,0,0,.72);color:#fff;font-size:.85rem;padding:.45rem .9rem;border-radius:999px;pointer-events:none}
.home{max-width:820px;margin:0 auto;padding-top:1.2rem}
.hhead{display:flex;gap:16px;align-items:center;margin-bottom:.6rem}.hhead img{border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);flex:none}
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:.8rem 0}@media (max-width:640px){.games{grid-template-columns:1fr}}
.game{border-radius:20px;padding:1rem 1.1rem 1.1rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.game.fk{background:radial-gradient(circle at 30% 0%,#2a7049,#153f2a)}
.game.uno{background:radial-gradient(circle at 30% 0%,#2f3570,#1b1e3a)}
.game h2{margin-top:.4rem}.game p{margin:.3rem 0}
.art{height:86px;display:flex;justify-content:center;align-items:center;gap:0}
.mini{display:inline-flex;align-items:center;justify-content:center;text-align:center;width:46px;height:66px;margin:0 -6px;border-radius:8px;background:var(--ivory);color:var(--ink);font:700 1.05rem/1.05 Georgia,serif;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.mini.red{color:var(--red)}.mini.u{font-family:-apple-system,sans-serif;font-size:1.25rem;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.85)}
.lounge{display:flex;gap:14px;align-items:center;justify-content:space-between}.lounge .big{width:auto;flex:none;margin:0;padding:.8rem 1.4rem}@media (max-width:640px){.lounge{flex-direction:column;align-items:stretch}.lounge .big{width:100%}}
.lp{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:.88rem;line-height:1.35}@media (max-width:640px){.ways{grid-template-columns:1fr}}
.rj{display:block;width:100%;text-align:left;margin-top:6px}.rj span{opacity:.7;font-size:.85rem}
.conn{position:fixed;right:10px;bottom:10px;font-size:.75rem;opacity:.6}
.minirun{display:flex;gap:22px;align-items:center;justify-content:center;padding:10px 6px 24px;background:rgba(0,0,0,.18);border-radius:14px;margin:.6rem 0;min-height:96px}
.fan{position:relative;height:80px;flex:1;max-width:260px}
.fan .card{position:absolute;top:50%;width:40px;height:56px;margin-top:-28px;font-size:1.55rem;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.fan .card small{font-size:1.1rem}
.fan .card.last{outline:2px solid var(--brass);outline-offset:1px}
.minirun .card.ghost{width:44px;height:60px;font-size:1.5rem}.minirun .card.ghost small{font-size:1.05rem}
.minirun .lbl{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:.62rem;opacity:.75;margin-top:2px}
.card.ghost{background:transparent;border:2px dashed rgba(251,247,236,.65);color:rgba(251,247,236,.8);box-shadow:none}
.card.ghost.red{color:#ff9d99}
.dealin{font-family:"Fraunces",Georgia,serif;font-size:1.4rem;color:var(--brass);text-align:center}
.won{display:inline-flex;align-items:center;gap:8px;background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.55);border-radius:14px;padding:6px 12px;margin:.3rem auto;font-size:1.05rem}
.won .card{width:34px;height:46px;font-size:1rem;flex:none}.won .card small{font-size:.65rem}
.won .amt{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;color:var(--brass);line-height:1}
.app.table .won{font-size:1.3rem;padding:8px 16px}.app.table .won .card{width:46px;height:62px;font-size:1.3rem}.app.table .won .amt{font-size:2rem}
.leadcall{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;line-height:1.1;text-align:center;margin:.4rem 0}
.leadcall .col{display:inline-block;padding:.05em .35em;border-radius:8px;background:var(--ivory);color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.leadcall .col.red{color:var(--red)}
#howto{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.75);display:flex;align-items:center;justify-content:center;padding:20px}
#howto .sheet{background:var(--felt-deep);border-radius:20px;padding:1.2rem;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#howto .step{display:flex;gap:12px;margin:10px 0}#howto .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brass);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
#banner:empty{display:none}
.fanfare{background:linear-gradient(160deg,#fff4c2,#e9c54a);color:#2a2410;border-radius:22px;padding:1.2rem 1.6rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 6px rgba(201,162,39,.35);max-width:88vw;animation:pop .5s cubic-bezier(.2,1.4,.4,1),fade .6s 3.6s forwards}
.fanfare h2{font-size:1.9rem;color:#2a2410}.fanfare .big{font-family:"Fraunces",Georgia,serif;font-size:3rem;line-height:1;margin:.2rem 0}
.fanfare .sub{font-size:.95rem;opacity:.8}
.fanfare .card{display:inline-flex;width:56px;height:78px;font-size:1.6rem;margin:.3rem 0;box-shadow:0 4px 12px rgba(0,0,0,.3)}.fanfare .card small{font-size:1rem}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}}
@keyframes fade{to{opacity:0;transform:scale(.9)}}
.spark{position:absolute;font-size:1.6rem;animation:spark 1.4s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
#vid{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:6px 10px;overflow-x:auto;min-height:0}
#vid:empty{display:none}
.tile{position:relative;flex:none;width:78px;height:104px;border-radius:10px;overflow:hidden;background:#111;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.app.table ~ #vid .tile, body.tbl .tile{width:150px;height:112px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.me video{transform:scaleX(-1)}
.tile .nm{position:absolute;left:0;right:0;bottom:0;font-size:.68rem;padding:2px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mic{position:absolute;top:4px;right:4px;font-size:.7rem;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 4px}
.vctl{flex:none;display:flex;flex-direction:column;gap:5px;margin-left:auto}
.vctl button{padding:.45rem .7rem;font-size:.82rem;border-radius:9px}
body.hasvid .app{padding-top:128px}
body.hasvid.tbl .app{padding-top:136px}

/* --- Game Night shell: the game runs in a frame beneath the video bar; the shell (and its video mesh) never reloads --- */
#stage{position:fixed;left:0;right:0;top:0;width:100%;height:100%;border:0;display:none;background:transparent}
body.ingame #stage{display:block}
body.ingame #app{display:none}
#gohome{position:fixed;top:env(safe-area-inset-top,0px);left:0;z-index:30;display:none;margin:6px;padding:7px 11px;border-radius:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.2);font-size:1rem;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}

.vctl .roomchip{background:rgba(201,162,39,.22);border-color:rgba(201,162,39,.6);color:#f0d98c;font-weight:600;white-space:nowrap}
.emojirow{display:flex;flex-wrap:wrap;gap:7px}
.emo{width:42px;height:42px;border:0;padding:0;border-radius:12px;background:rgba(255,255,255,.08);font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:600}
.emo.on{background:rgba(255,255,255,.18);box-shadow:0 0 0 2px #ffd166}
/* v2.8.20 room polish */
.games .game{display:flex;flex-direction:column}
.games .game button.big:first-of-type{margin-top:auto}
.irow{display:flex;gap:8px}.irow>*{flex:1}.irow input{min-width:0}
#qr{display:inline-block;background:#fbf7ec;padding:8px;border-radius:10px;line-height:0}
#updbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#c9a227;color:#1b1a17;font-weight:600;box-shadow:0 -2px 12px rgba(0,0,0,.45)}
#updbar button{background:#1b1a17;color:#fbf7ec;border:0;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer}
/* v2.8.23 room tile grid (video when on, avatar when off) */
body.inroom:not(.ingame) #vid{flex-wrap:wrap;justify-content:center;align-content:flex-start;overflow:visible;gap:8px;padding:12px 10px;max-width:600px;margin:0 auto;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.inroom:not(.ingame).hasvid #vid{padding-left:10px}
body.inroom:not(.ingame) .tile{width:92px;height:92px}

body.inroom:not(.ingame) #gohome{display:none}
.tile .ava{width:100%;height:100%;display:grid;place-items:center;font-size:2rem;background:#1c3b52}
.tile.me .ava{background:#1f4a34}
.tile .tgear{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:0;color:#fff;font-size:.72rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}

<input type="file" accept="image/*" capture="user" id="selfiein" hidden>
<script>
(function(){
const VERSION='v2.8.38 · 26 Oct 2026'; // shown at the bottom of the home page and the room
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const get=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const set=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let pid=get('fk-pid'); if(!pid){ pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36); set('fk-pid',pid); }
const qs=new URLSearchParams(location.search);
let room=(qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
let nick=get('fk-nick');
let emoji=get('fk-emoji')||'';
let myPhoto=get('fk-photo')||''; const photos={}; if(myPhoto) photos[pid]=myPhoto;
const EMOJIS=['🦊','🐯','🐼','🦄','🦁','🐸','🐵','🦉','🐙','🐨','👑','🚀','⚽','🎸','🌈','😎'];
// Nudge people out of Messenger/WhatsApp's in-app browser (where video is flaky, names aren't remembered, and popups get clipped) into real Safari or the home-screen app.
let iabDismissed=false;
const inAppBrowser=/FBAN|FBAV|FB_IAB|Instagram|Messenger|WhatsApp|Line\//i.test(navigator.userAgent||'') || (/iPhone|iPad|iPod/.test(navigator.userAgent||'') && window.navigator.standalone!==true && !/Safari/.test(navigator.userAgent||''));

/* ---------- which game a host action starts (mirrors test/shell-core.mjs) ---------- */
function roomMessageFor(action){
  if(!(S&&S.host)) return null;
  switch(action){
    case 'pick-fk': case 'switch-fk': return {t:'switchgame',to:'fk'};
    case 'pick-uno': case 'switch-uno': return {t:'switchgame',to:'uno'};
    case 'back-to-room': return {t:'toroom'};
    default: return null;
  }
}
function gameSrc(game,mode){
  const p=new URLSearchParams(); p.set('room',room); p.set('mode',mode||'hand'); p.set('framed','1');
  if(lastGotoAt) p.set('from',String(lastGotoAt));
  if(S&&S.host&&S.goto&&S.goto.bots) p.set('bots',String(S.goto.bots));
  if(S&&S.host) p.set('layout','phones');
  return (game==='uno'?'/uno.html':'/fk.html')+'?'+p.toString();
}

/* ---------- video: WebRTC mesh keyed by the stable device id (pid), so it survives a game change ---------- */
function wantedPids(peers,me,on,tbl){ const want=new Set(); for(const p of peers||[]){ if(!p||!p.pid||p.pid===me) continue; if(p.video||on||tbl) want.add(p.pid); } return want; } // receive every broadcaster; and when I'm sending (or I'm the table), also connect to camera-off devices so they receive me — otherwise a camera-on phone never initiates to a camera-off PC and the handshake deadlocks
const isPolite=(a,b)=>String(a)>String(b);
const GRACE=10000;
const rtc={on:false,mic:false,joining:false,queue:[],stream:null,peers:{},ice:{iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]},iceLoaded:false};
const vidEl=document.getElementById('vid');
const myPid=()=>S?S.you:pid;
const iParticipate=()=>rtc.on||isTbl();
// a device may hold two sockets to the room during 4 Kings (this shell + its game frame); show one tile per device, preferring the video-on entry
function peerList(){ const m=new Map(); for(const p of (S&&S.peers)||[]){ if(!p||!p.pid) continue; const cur=m.get(p.pid); if(!cur||(!cur.video&&p.video)) m.set(p.pid,p); } return [...m.values()]; }
async function loadIce(){ if(rtc.iceLoaded) return; try{ const r=await fetch('/ice'); if(r.ok) rtc.ice=await r.json(); }catch(e){} rtc.iceLoaded=true; }
async function startVideo(){
  if(rtc.on||rtc.joining) return; rtc.joining=true;
  try{ rtc.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:320},height:{ideal:240},frameRate:{ideal:15},facingMode:'user'},audio:true}); }
  catch(e){ rtc.joining=false; rtc.queue=[]; const nm=(e&&e.name)||''; viewMsg = (nm==='NotAllowedError'||nm==='SecurityError') ? 'Camera blocked — allow camera/mic access in your browser, then tap Join video again.' : (nm==='NotFoundError'||nm==='OverconstrainedError'||/not found/i.test((e&&e.message)||'')) ? 'No camera found on this device — you can still play without video.' : 'Camera/mic unavailable — you can still play without video.'; render(); return; }
  rtc.stream.getAudioTracks().forEach(t=>t.enabled=rtc.mic);
  rtc.on=true; set('gn-video','1'); await loadIce();
  Object.keys(rtc.peers).forEach(closePeer); sendMsg({t:'video',on:true}); syncPeers();
  rtc.joining=false; const held=rtc.queue; rtc.queue=[]; held.forEach(([f,d])=>onRtc(f,d)); renderVideo();
}
function stopVideo(){ if(!rtc.on) return; rtc.on=false; set('gn-video','0'); rtc.stream.getTracks().forEach(t=>t.stop()); rtc.stream=null; Object.keys(rtc.peers).forEach(closePeer); sendMsg({t:'video',on:false}); syncPeers(); renderVideo(); }
function toggleMic(){ rtc.mic=!rtc.mic; if(rtc.stream) rtc.stream.getAudioTracks().forEach(t=>t.enabled=rtc.mic); renderVideo(); }
function syncPeers(){
  if(!S) return; const now=Date.now();
  const want=wantedPids(peerList(),myPid(),rtc.on,isTbl());
  // keep a connection alive through a game change: a peer that drops off the room's list is only closed after the grace window
  for(const id of Object.keys(rtc.peers)){ if(want.has(id)) rtc.peers[id].goneAt=0; else if(!rtc.peers[id].goneAt) rtc.peers[id].goneAt=now; else if(now-rtc.peers[id].goneAt>=GRACE) closePeer(id); }
  want.forEach(id=>{ if(!rtc.peers[id]) makePeer(id); });
  renderVideo();
}
setInterval(()=>{ if(rtc.on||isTbl()||((S&&S.peers||[]).some(p=>p&&p.video&&p.pid!==myPid()))) syncPeers(); },3000); // advance grace timers AND keep a camera-off device connecting to broadcasters (not just when its own camera is on)
function makePeer(id){
  const pc=new RTCPeerConnection(rtc.ice); const p={pc,polite:isPolite(myPid(),id),stream:null,making:false,ignore:false,cands:[],goneAt:0}; rtc.peers[id]=p;
  if(rtc.stream) rtc.stream.getTracks().forEach(t=>pc.addTrack(t,rtc.stream));
  else { try{ pc.addTransceiver('video',{direction:'recvonly'}); pc.addTransceiver('audio',{direction:'recvonly'}); }catch(e){} } // camera off: still receive everyone else
  pc.onnegotiationneeded=async()=>{ const other=peerList().find(x=>x.pid===id); if(p.polite&&other&&other.video&&!pc.remoteDescription) return; try{ p.making=true; await pc.setLocalDescription(); sendMsg({t:'rtc',to:id,data:{description:pc.localDescription}}); }catch(e){ console.warn(e); } finally{ p.making=false; } };
  pc.onicecandidate=({candidate})=>{ if(candidate) sendMsg({t:'rtc',to:id,data:{candidate}}); };
  pc.ontrack=ev=>{ p.stream=ev.streams[0]||new MediaStream([ev.track]); renderVideo(); };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed'){ closePeer(id); setTimeout(syncPeers,1500); } renderVideo(); };
  return p;
}
function closePeer(id){ const p=rtc.peers[id]; if(!p) return; try{p.pc.close();}catch(e){} delete rtc.peers[id]; }
async function onRtc(from,data){
  if(rtc.joining){ rtc.queue.push([from,data]); return; }
  if(!S||!peerList().some(x=>x.pid===from)) return;
  let p=rtc.peers[from]; if(!p){ if(!wantedPids(peerList(),myPid(),rtc.on,isTbl()).has(from)) return; await loadIce(); p=makePeer(from); } else p.goneAt=0; // accept an inbound connection from any peer we want (a camera-off device still wants every broadcaster)
  const pc=p.pc;
  try{
    if(data.description){
      const collision=data.description.type==='offer'&&(p.making||pc.signalingState!=='stable');
      p.ignore=!p.polite&&collision; if(p.ignore) return;
      await pc.setRemoteDescription(data.description);
      for(const c of p.cands.splice(0)){ try{ await pc.addIceCandidate(c); }catch(e){} }
      if(data.description.type==='offer'){ await pc.setLocalDescription(); sendMsg({t:'rtc',to:from,data:{description:pc.localDescription}}); }
    } else if(data.candidate){ if(!pc.remoteDescription){ p.cands.push(data.candidate); return; } try{ await pc.addIceCandidate(data.candidate); }catch(e){ if(!p.ignore) console.warn(e); } }
  }catch(e){ console.warn(e); }
}
function renderVideo(){
  const tiles=[]; document.body.classList.toggle('tbl',isTbl());
  const inRoom=!!(room&&S&&S.lounge)&&!document.body.classList.contains('ingame'); // only the room shows avatar tiles for everyone; in-game stays video-only
  if(rtc.on) tiles.push({key:'me',stream:rtc.stream,name:'You',me:true});
  const pl=peerList();
  for(const id in rtc.peers){ const peer=pl.find(x=>x.pid===id); if(peer&&peer.video&&rtc.peers[id].stream) tiles.push({key:id,stream:rtc.peers[id].stream,name:peer.name}); }
  if(inRoom){ const shown=new Set(tiles.map(t=>t.key));
    if(!shown.has('me')){ tiles.push({key:'me',name:'You',me:true,avatar:emoji||'🙂',photoId:pid}); shown.add('me'); }
    for(const p of S.players){ if(p.bot||p.id===pid||shown.has(p.id)) continue; tiles.push({key:p.id,name:p.name,avatar:p.emoji||'🙂',photoId:p.id}); shown.add(p.id); } }
  const keep=new Set(tiles.map(t=>t.key));
  [...vidEl.querySelectorAll('.tile')].forEach(el=>{ if(!keep.has(el.dataset.key)) el.remove(); });
  tiles.forEach(t=>{ const kind=t.stream?'video':'avatar'; let el=vidEl.querySelector(`.tile[data-key="${t.key}"]`);
    if(el&&el.dataset.kind!==kind){ el.remove(); el=null; }
    if(!el){ el=document.createElement('div'); el.className='tile'+(t.me?' me':''); el.dataset.key=t.key; el.dataset.kind=kind;
      if(kind==='video'){ const v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline',''); v.muted=!!t.me; el.appendChild(v); }
      else { const a=document.createElement('div'); a.className='ava'; el.appendChild(a); }
      const n=document.createElement('div'); n.className='nm'; el.appendChild(n);
      if(t.me){ const g=document.createElement('button'); g.type='button'; g.className='tgear'; g.textContent='⚙️'; g.title='Edit your name or emoji'; g.setAttribute('aria-label','Edit your name or emoji'); g.onclick=(e)=>{ e.stopPropagation(); meOpen=true; render(); const m=document.getElementById('meedit'); if(m){ m.hidden=false; m.scrollIntoView({block:'nearest'}); } }; el.appendChild(g); }
      vidEl.insertBefore(el,vidEl.querySelector('.vctl')); }
    if(kind==='video'){ const v=el.querySelector('video'); if(v.srcObject!==t.stream){ v.srcObject=t.stream; v.play().catch(()=>{}); } }
    else { const ava=el.querySelector('.ava'); const ph=t.photoId&&photos[t.photoId]; if(ph){ ava.textContent=''; ava.style.backgroundImage='url('+ph+')'; ava.style.backgroundSize='cover'; ava.style.backgroundPosition='center'; } else { ava.style.backgroundImage=''; ava.textContent=t.avatar||'🙂'; } }
    el.querySelector('.nm').textContent=t.name; });
  let ctl=vidEl.querySelector('.vctl');
  const showCtl=room&&S;
  if(showCtl){ if(!ctl){ ctl=document.createElement('div'); ctl.className='vctl'; vidEl.appendChild(ctl); }
    const inGame=document.body.classList.contains('ingame'); // show the room code only while a game is on (the lobby already shows it)
    const roomBtn=inGame?`<button class="ghost roomchip" id="roombtn" title="Tap to invite someone to this room">🔗 Room ${esc(room)}</button>`:'';
    ctl.innerHTML=roomBtn+(rtc.on?`<button class="ghost" id="micbtn">${rtc.mic?'🎤 Mic on':'🔇 Mic off'}</button><button class="ghost" id="vidoff">Leave video</button>`:`<button id="vidon">📷 Join video</button>`);
    const q=s=>ctl.querySelector(s); if(q('#vidon')) q('#vidon').onclick=startVideo; if(q('#vidoff')) q('#vidoff').onclick=stopVideo; if(q('#micbtn')) q('#micbtn').onclick=toggleMic; if(q('#roombtn')) q('#roombtn').onclick=()=>shareInvite(q('#roombtn'),'🔗 Room '+room);
  } else if(ctl) ctl.remove();
  document.body.classList.toggle('hasvid',vidEl.children.length>0);
  layoutForVideo();
}
// Size the game frame to the space left under the video bar (its height varies by device,
// orientation and notch), and pad the lobby/home the same way. Fixes the collapsed-frame bug.
function layoutForVideo(){
  const barBottom = (vidEl && vidEl.children.length) ? Math.ceil(vidEl.getBoundingClientRect().bottom) : 0;
  if(document.body.classList.contains('ingame')){
    stage.style.top = barBottom + 'px';
    stage.style.height = (barBottom ? 'calc(100% - ' + barBottom + 'px)' : '100%');
    app.style.paddingTop = '';
  } else {
    stage.style.top = ''; stage.style.height = '';
    app.style.paddingTop = barBottom ? barBottom + 'px' : '';
  }
}
['resize','orientationchange'].forEach(ev=>window.addEventListener(ev,layoutForVideo));

/* ---------- connection: one socket to the room (Table DO) for the whole night — presence + video ---------- */
function connect(){
  if(!room) return;
  if(ws){ try{ws.onclose=null;ws.close();}catch(e){} }
  const proto=location.protocol==='https:'?'wss':'ws';
  const role=get('fk-lhost')===room?'both':'hand';
  ws=new WebSocket(`${proto}://${location.host}/ws/${room}?pid=${encodeURIComponent(pid)}&role=${role}`);
  connEl.textContent='connecting…';
  ws.onopen=()=>{ connEl.textContent='● live'; reconnectIn=800; keepAwake(); ws.send(JSON.stringify({t:'hello'})); if(rtc.on){ ws.send(JSON.stringify({t:'video',on:true})); loadIce(); } };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.t==='err'){ return; }
    if(m.t==='rtc'){ onRtc(m.from,m.data); return; }
    if(m.t==='closed'){ goHome(); return; } // the session was finished for everyone
    if(m.t==='photo'){ if(m.photo) photos[m.pid]=m.photo; else delete photos[m.pid]; renderVideo(); return; }
    if(m.t==='state'){ S=m.s; onState(S); render(); syncPeers(); } };
  ws.onclose=()=>{ connEl.textContent='reconnecting…'; setTimeout(connect,reconnectIn); reconnectIn=Math.min(reconnectIn*1.6,8000); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
function sendMsg(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function onState(st){
  skew=st.serverNow-Date.now();
  // appear in the room's people list once we're in a lounge and have a remembered name
  if(st.lounge&&!autoTried&&!st.players.some(p=>p.id===pid)&&nick){ autoTried=true; sendMsg({t:'join',name:nick,emoji}); if(myPhoto) sendMsg({t:'photo',photo:myPhoto}); }
  // host chores: bring the room up, or kick off a game picked from the home page
  if(wantLobby){ if(st.lounge) wantLobby=false; else if(st.host) sendMsg({t:'toroom'}); }
  if(wantStart&&st.host){ wantStart.forEach(m=>sendMsg(m)); wantStart=null; }
  // decide what belongs on screen (mirrors test/shell-core.mjs screenFor)
  if(st.lounge){ inLobby=true; curGame=null; }
  else if(st.goto&&typeof st.goto.at==='number'&&st.goto.at>lastGotoAt){ lastGotoAt=st.goto.at; curGame=st.goto.to==='uno'?'uno':'fk'; inLobby=false; }
  else { inLobby=false; if(!curGame) curGame=wantGame||'fk'; }
}
function render(){
  document.body.classList.toggle('inroom',!!room);
  if(!room){ document.body.classList.remove('ingame'); app.style.display=''; if(stageGame){ stage.src='about:blank'; stageGame=null; } app.innerHTML=iabBanner()+startHTML(); bind(); renderVideo(); return; }
  if(!S){ document.body.classList.remove('ingame'); app.style.display=''; app.innerHTML=`<div class="wait">Joining ${esc(room)}…</div>`; renderVideo(); return; }
  if(inLobby||!curGame){ document.body.classList.remove('ingame'); app.style.display=''; if(stageGame){ stage.src='about:blank'; stageGame=null; } app.innerHTML=iabBanner()+loungeHTML(S)+(viewMsg?`<div class="notice">${esc(viewMsg)}</div>`:''); bind(); renderVideo(); return; }
  // a game is on: show it in the frame; the shell (and video) stay put
  const mode2=S.host?'both':'hand';
  if(stageGame!==curGame){ stage.src=gameSrc(curGame,mode2); stageGame=curGame; }
  document.body.classList.add('ingame'); app.style.display='none'; renderVideo();
}

  ${host?`<div class="games">

    <input class="code" id="code" placeholder="CODE" maxlength="6" value="" autocapitalize="characters" autocomplete="off">
    <div class="row" style="margin-top:8px"><button class="ghost" id="joinroom">Join 4 Kings</button><button class="ghost" id="joinuno">Join Ultium UNO</button></div></div>
  <div class="panel ways"><div><b>Play with an iPad table</b><br>Everyone in one room. Open this on the iPad (or a TV or laptop) in the middle; it shows the table and a code. Everyone else scans it and plays on their phone.</div><div><b>Play on our own devices</b><br>No shared screen, so it's great for playing from different houses. Your phone runs the game and every phone shows the table plus its own cards. Send the join link, then tap <b>Join video</b> to see each other.</div></div>
  <p class="small muted center" style="opacity:.6">Game Night ${VERSION}</p></div>`;
}
function goHome(){ stopVideo(); if(ws){try{ws.onclose=null;ws.close();}catch(e){}} ws=null; S=null; room=''; curGame=null; inLobby=false; stageGame=null; stage.src='about:blank'; wantGame=''; wantLobby=false; wantStart=null; autoTried=false; history.replaceState(null,'','/?home=1'); render(); }
// The room's join link + share/copy. Used by the lobby's Invite button and the in-game room-code chip
// so a latecomer can be sent the code/link while a game is in progress (it opens straight into the room).
function roomLink(){ return location.origin+'/?room='+room+'&mode=lounge'; }
async function shareInvite(btn,label){ const link=roomLink(); const base=label||(btn&&btn.textContent)||'';
  try{ if(navigator.share){ await navigator.share({title:'Game Night room '+room,text:'Join my Game Night room',url:link}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(link); if(btn){ btn.textContent='Copied!'; setTimeout(()=>{ if(btn.isConnected&&base) btn.textContent=base; },1800); } }catch(e){ prompt('Copy this link:',link); } }
function freshRoom(){ curGame=null; inLobby=false; stageGame=null; lastGotoAt=0; autoTried=false; S=null; }
function startOwn(game){ room=newCode(); set(game==='uno'?'uno-room':'fk-room',room); set('fk-lhost',room); wantGame=game; wantLobby=false; wantStart=game==='uno'?[{t:'settings',layout:'phones'},{t:'switchgame',to:'uno'}]:[{t:'settings',layout:'phones'}]; freshRoom(); history.replaceState(null,'','/'); render(); connect(); }
function startRoom(){ room=newCode(); set('fk-lhost',room); set('fk-room',room); wantGame=''; wantLobby=true; wantStart=null; freshRoom(); history.replaceState(null,'','/'); render(); connect(); }
function joinCode(game,c){ if(c.length<3) return; room=c; set(game==='uno'?'uno-room':'fk-room',room); wantGame=game; wantLobby=false; wantStart=null; freshRoom(); history.replaceState(null,'','/'); render(); connect(); }
function bind(){
  const q=s=>app.querySelector(s);
  if(q('#newtable')) q('#newtable').onclick=()=>{ location.href='/fk.html?setup=table'; };
  if(q('#newphones')) q('#newphones').onclick=()=>startOwn('fk');
  if(q('#unotable')) q('#unotable').onclick=()=>{ location.href='/uno.html?setup=table'; };
  if(q('#unophones')) q('#unophones').onclick=()=>startOwn('uno');
  if(q('#newlounge')) q('#newlounge').onclick=()=>startRoom();
  if(q('#joinroom')) q('#joinroom').onclick=()=>joinCode('fk',(q('#code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''));
  if(q('#joinuno')) q('#joinuno').onclick=()=>joinCode('uno',(q('#code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''));
  if(q('#iabx')) q('#iabx').onclick=()=>{ iabDismissed=true; render(); };
  if(q('#lgofk')) q('#lgofk').onclick=()=>{ const m=roomMessageFor('pick-fk'); if(m) sendMsg(m); };
  if(q('#lgouno')) q('#lgouno').onclick=()=>{ const m=roomMessageFor('pick-uno'); if(m) sendMsg(m); };
  if(q('#join')) q('#join').onclick=()=>{ nick=(q('#nick').value||'').trim().slice(0,18)||'Player'; set('fk-nick',nick); sendMsg({t:'join',name:nick,emoji}); if(myPhoto) sendMsg({t:'photo',photo:myPhoto}); };
  q('#emojirow') && q('#emojirow').querySelectorAll('button').forEach(b=>b.onclick=()=>{ emoji=b.dataset.emoji||''; set('fk-emoji',emoji); if(S&&S.players&&S.players.some(p=>p.id===pid)&&nick) sendMsg({t:'join',name:nick,emoji}); render(); });
  q('#emojirow2') && q('#emojirow2').querySelectorAll('button').forEach(b=>b.onclick=()=>{ emoji=b.dataset.emoji||''; set('fk-emoji',emoji); q('#emojirow2').querySelectorAll('button').forEach(x=>x.classList.toggle('on',(x.dataset.emoji||'')===emoji)); if(nick) sendMsg({t:'join',name:nick,emoji}); });
  if(q('#editme')) q('#editme').onclick=()=>{ meOpen=!meOpen; const d=q('#meedit'); if(d) d.hidden=!meOpen; };
  if(q('#saveme')) q('#saveme').onclick=()=>{ nick=(q('#nick').value||'').trim().slice(0,18)||nick||'Player'; set('fk-nick',nick); sendMsg({t:'join',name:nick,emoji}); meOpen=false; const d=q('#meedit'); if(d) d.hidden=true; };
  if(q('#takeselfie')){ const inp=document.getElementById('selfiein'); if(inp) q('#takeselfie').onclick=()=>inp.click(); }
  if(q('#rmselfie')) q('#rmselfie').onclick=()=>{ myPhoto=''; set('fk-photo',''); delete photos[pid]; sendMsg({t:'photo',photo:''}); render(); };
  if(q('#leaveRoom')) q('#leaveRoom').onclick=()=>goHome();
  if(q('#sharelink')) q('#sharelink').onclick=()=>shareInvite(q('#sharelink'),'🔗 Share link');
  if(q('#showqr')) q('#showqr').onclick=()=>{ const box=q('#qrbox'); if(!box) return; box.hidden=!box.hidden; const qr=q('#qr'); if(!box.hidden&&qr&&window.QRCode&&!qr.hasChildNodes()){ try{ new QRCode(qr,{text:qr.dataset.link,width:180,height:180,colorDark:'#1b1a17',colorLight:'#fbf7ec',correctLevel:QRCode.CorrectLevel.M}); }catch(e){} } };
  if(q('#entercode')) q('#entercode').onclick=()=>{ const b=q('#codebox'); if(b) b.hidden=!b.hidden; };
  if(q('#gocode')) q('#gocode').onclick=()=>{ const c=(q('#joincode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); if(c) location.href='/?room='+c+'&mode=lounge'; };
}

/* ---------- a game frame asks the shell to move the whole party ---------- */
window.addEventListener('message',e=>{ const d=e&&e.data; if(!d||d.gn!=='action') return;
  if(d.action==='home'){ goHome(); return; }
  if(d.action==='endsession'){ sendMsg({t:'endsession'}); return; } // finish the whole session for everyone
  const m=roomMessageFor(d.action); if(m) sendMsg(m);
});

/* ---------- test hook (read-only; lets the end-to-end check that the camera survives a game change) ---------- */
window.__gn={stream:()=>rtc.stream,streamId:()=>rtc.stream&&rtc.stream.id,peers:()=>Object.keys(rtc.peers),on:()=>rtc.on,screen:()=>({room,curGame,inLobby,host:!!(S&&S.host)})};

document.getElementById('gohome').onclick=()=>{ if(confirm('Leave this game and go back to the Game Night home page?')) goHome(); };
/* ---------- boot ---------- */
if(qs.get('home')) history.replaceState(null,'','/'); // the home-screen icon opens the home page once
if(room){ wantGame = qs.get('game')==='uno'?'uno':(qs.get('mode')==='lounge'?'':'fk'); if(qs.get('room')) history.replaceState(null,'','/'); }
render();
if(room) connect();

/* ---------- auto-update: catch a newer deploy (past any cache) and offer a one-tap refresh ---------- */
let updateSeen=false;
async function checkVersion(){
  if(updateSeen||document.hidden) return;
  try{ const r=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const t=await r.text(); const m=t.match(/const VERSION='([^']+)'/);
    if(m&&m[1]&&m[1]!==VERSION){ updateSeen=true; showUpdateBar(); }
  }catch(e){}
}
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  const bar=document.createElement('div'); bar.id='updbar';
  bar.innerHTML='<span>A new version of Game Night is ready.</span><button id="updnow">Refresh</button>';
  document.body.appendChild(bar);
  document.getElementById('updnow').onclick=()=>location.reload();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkVersion(); });
window.addEventListener('focus',checkVersion);
setTimeout(checkVersion,4000);

/* ---------- selfie avatar: snap, square-crop, shrink to ~128px, share on the photo channel ---------- */
function onSelfie(file){ const img=new Image(); img.onload=()=>{ try{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128); let d=c.toDataURL('image/jpeg',0.72); if(d.length>60000) d=c.toDataURL('image/jpeg',0.5); myPhoto=d; set('fk-photo',d); photos[pid]=d; if(ws&&ws.readyState===1) sendMsg({t:'photo',photo:d}); render(); }catch(e){} try{URL.revokeObjectURL(img.src);}catch(e){} }; img.onerror=()=>{ try{URL.revokeObjectURL(img.src);}catch(e){} }; img.src=URL.createObjectURL(file); }
{ const inp=document.getElementById('selfiein'); if(inp) inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(f) onSelfie(f); }; }
})();
</script>
