<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1e3a">
<title>Ultium UNO</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#1b1e3a; --bg2:#14162c; --panel:#262a52; --line:rgba(255,255,255,.12); --fg:#f4f2ff; --dim:#a9a6cf;
  --R:#e2453c; --Y:#f5c02e; --G:#2fa866; --B:#2c7be5; --W:#17171c; --gold:#ffd166;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#2a2f5e 0%,var(--bg) 55%,var(--bg2) 100%);color:var(--fg);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
h1,h2,h3,.disp{font-family:"Fredoka","Arial Rounded MT Bold",-apple-system,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:2.6rem;line-height:1} h2{font-size:1.5rem;line-height:1.15} h3{font-size:1.1rem}
p{margin:.4rem 0}
.app{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.app.table{max-width:1180px;padding-bottom:40px}
button{font:inherit;border:0;border-radius:14px;padding:.75rem 1.1rem;cursor:pointer;background:var(--fg);color:var(--bg);font-weight:600}
button.ghost{background:rgba(255,255,255,.1);color:var(--fg);font-weight:500}
button.big{width:100%;padding:1rem;font-size:1.1rem;margin-top:.6rem}
button.small{padding:.4rem .7rem;font-size:.85rem}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font:inherit;padding:.65rem .8rem;border-radius:12px;border:1px solid var(--line);background:#fff;color:#111;width:100%}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:"Fredoka",sans-serif;font-size:1.6rem;text-align:center}
.dim{color:var(--dim)}.small{font-size:.86rem}.center{text-align:center}
.row{display:flex;gap:.6rem;align-items:center}.row>*{flex:1}
.panel{background:var(--panel);border-radius:18px;padding:.8rem 1rem;margin:.6rem 0}
.notice{background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.5);border-radius:14px;padding:.7rem .9rem;margin:.6rem 0}
/* cards */
.card{--c:var(--W);position:relative;width:54px;height:80px;border-radius:9px;background:var(--c);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 5px var(--c);flex:none;user-select:none}
.card.R{--c:var(--R)}.card.Y{--c:var(--Y);color:#2b2200}.card.G{--c:var(--G)}.card.B{--c:var(--B)}
.card .v{font-size:1.75rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.card .cn{position:absolute;top:6px;left:7px;font-size:.7rem;line-height:1}
.card .cn.b{top:auto;left:auto;bottom:6px;right:7px;transform:rotate(180deg)}
.card .wheel{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--R) 0 25%,var(--Y) 0 50%,var(--G) 0 75%,var(--B) 0);box-shadow:0 0 0 2px #fff}
.card .wlbl{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:.6rem;font-weight:600;letter-spacing:.02em}
.card.wildv .v{position:absolute;font-size:1rem;color:#fff;text-shadow:0 1px 2px #000}
.card.back{background:repeating-linear-gradient(45deg,#3a3f7a 0 6px,#30346a 6px 12px);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.85)}
.card.back::after{content:"DECK";font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.card.back.lg::after{font-size:1.05rem;letter-spacing:.16em}
.card.lg{width:96px;height:142px;border-radius:14px}.card.lg .v{font-size:3rem}.card.lg .cn{font-size:1rem;top:9px;left:10px}.card.lg .cn.b{bottom:9px;right:10px}.card.lg .wheel{width:54px;height:54px}.card.lg .wlbl{font-size:.8rem;bottom:10px}.card.lg.wildv .v{font-size:1.5rem}
.card.sm{width:34px;height:50px;border-radius:6px}.card.sm .v{font-size:1.05rem}.card.sm .cn{display:none}.card.sm .wheel{width:18px;height:18px}.card.sm .wlbl{display:none}
/* the round table */
.tlayout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media (max-width:820px){.tlayout{grid-template-columns:1fr}}
/* table + your cards on one screen: cards right under the table, side panel after (phones) or alongside (wide) */
.tlayout.withhand{grid-template-areas:"round side" "hand side"}.tlayout.withhand>.tl-round{grid-area:round}.tlayout.withhand>.tl-side{grid-area:side}.tlayout.withhand>.tl-hand{grid-area:hand}
@media (max-width:820px){.tlayout.withhand{grid-template-areas:"round" "hand" "side"}
  /* small screens: cap the table by viewport height so your cards are on-screen without scrolling (it stacks round · hand · side) */
  .tlayout.withhand .tl-round .round{width:clamp(230px,44vh,100%)}}
@media (min-width:1000px){.tlayout.withhand{grid-template-columns:1fr 1fr 300px;grid-template-areas:"round hand side"}.tlayout.withhand .tl-hand{max-height:calc(100dvh - 150px);overflow-y:auto}}
/* merged (play on own-devices): the mat (discard · pot · deck) lives INSIDE the Your-cards panel — one box, no separate mat box above it. Two columns at every width: card panel + side. */
.tlayout.withhand.merged{grid-template-columns:minmax(0,480px) 300px;grid-template-areas:"hand side";justify-content:center}
.tlayout.withhand.merged>.tl-side{grid-area:side}.tlayout.withhand.merged>.tl-hand{grid-area:hand}
.handwrap{border:1px solid rgba(255,209,102,.4);max-width:480px;margin-left:auto;margin-right:auto}
.handwrap .mattop{margin:0 auto 2px} /* the mat row hugs the top of the card panel */
.handwrap>.small.dim{margin-top:4px}
.app.stripon .handwrap .round .felt{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line)} /* lighten the inner mat so it reads as part of the card panel, not a competing box */
@media (max-width:820px){.tlayout.withhand.merged{grid-template-columns:1fr;grid-template-areas:"hand" "side"}}
@media (min-width:1000px){.tlayout.withhand.merged{grid-template-columns:minmax(0,480px) 300px;grid-template-areas:"hand side";justify-content:center}.tlayout.withhand.merged .tl-hand{max-height:none;overflow:visible}}
.round{position:relative;width:min(100%,640px);aspect-ratio:1;margin:0 auto}
.round .felt{position:absolute;inset:11%;border-radius:50%;background:radial-gradient(circle,#323874 0%,#262a5a 70%,#1f2350 100%);box-shadow:inset 0 0 0 2px var(--line),0 20px 60px rgba(0,0,0,.35)}
.dring{position:absolute;inset:16%;border-radius:50%;pointer-events:none;opacity:.55}
.dring svg{width:100%;height:100%}
.dring.ccw svg{transform:scaleX(-1)} /* arrows point the other way; no spin — just show the current direction */
.dring.flip{animation:flip .55s ease} /* one-shot pulse only when the direction actually switches */
@keyframes flip{50%{transform:scale(.6);opacity:1}}
@media (prefers-reduced-motion:reduce){.dring.flip{animation:none}}
.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;min-width:92px;padding:.45rem .7rem;border-radius:999px;background:var(--panel);box-shadow:0 0 0 2px var(--line);transition:box-shadow .3s,background .3s}
.seat .nm{font-family:"Fredoka",sans-serif;font-weight:600;white-space:nowrap}
.seat .ct{font-size:.78rem;color:var(--dim)}
.seat.turn{background:var(--gold);color:#2b2200;box-shadow:0 0 0 4px rgba(255,209,102,.35),0 0 30px rgba(255,209,102,.6)}
.seat.turn .ct{color:#5a4a10}
.seat.out{opacity:.4}
.seat.one .ct{color:var(--R);font-weight:700}.seat.turn.one .ct{color:#9b1c14}
.pile{position:absolute;left:50%;top:50%;width:0;height:0}
.pile .pc{position:absolute;left:-48px;top:-71px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.halo{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle,var(--hc) 0%,transparent 68%);opacity:.45;transition:background .4s}
.deck{position:absolute;left:68%;top:50%;transform:translate(-50%,-50%);text-align:center}
.deck .n{font-size:.75rem;color:var(--dim);margin-top:4px}
.stackbadge{position:absolute;left:50%;top:69%;transform:translateX(-50%);background:var(--R);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.3rem;padding:.2rem .8rem;border-radius:999px;box-shadow:0 0 20px rgba(226,69,60,.6)}
.potchip{position:absolute;left:50%;top:79%;transform:translate(-50%,-50%);text-align:center;font-family:"Fredoka",sans-serif}
.potchip .n{font-size:1.6rem;color:var(--gold);line-height:1}.potchip .l{font-size:.72rem;color:var(--dim)}
.dirlbl{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:.8rem;color:var(--dim);white-space:nowrap}
/* v2.8.1 top turn strip (phones) — a thin strip of players that glides to whoever's turn it is */
.ustrip{position:fixed;left:0;right:0;top:0;z-index:8;height:108px;padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,rgba(13,15,34,.94),rgba(13,15,34,.74) 70%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  overflow:visible;clip-path:inset(-60px 0 0 0);display:none} /* clip the sides, let the current halo spill above */
.ustrip.on{display:block}
body.hasvid .ustrip{top:calc(124px + env(safe-area-inset-top,0px))} /* standalone in-page video: sit below the camera bar */
.ustrip .utrack{position:absolute;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));height:84px}
.ustrip .uchip{position:absolute;left:50%;top:0;width:72px;margin-left:-36px;text-align:center;will-change:transform,opacity;
  transition:transform .5s cubic-bezier(.3,.7,.25,1),opacity .5s} /* slow glide — the speed signed off in the mockup */
.ustrip.noanim .uchip{transition:none}
.ustrip .uava{width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative;
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.3rem;color:#fff;background:var(--panel);box-shadow:0 0 0 2px var(--line)}
.ustrip .ucnt{position:absolute;right:-5px;bottom:-5px;z-index:3;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:#11132b;color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.ustrip .unm{font-family:"Fredoka",sans-serif;font-weight:600;font-size:.74rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.ustrip .uchip.cur .uava{background:var(--gold);color:#2b2200;box-shadow:0 0 26px rgba(255,209,102,.7)}
.ustrip .uchip.cur .uava::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--gold);pointer-events:none;z-index:1;
  box-shadow:0 0 16px 2px rgba(255,209,102,.9),0 0 34px 8px rgba(255,209,102,.5)} /* strong bright-yellow ring, attached to the avatar so it can't drift */
.ustrip .uchip.cur .unm{color:var(--gold)}
.ustrip .uchip.one .ucnt{background:var(--R);box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(226,69,60,.8)} /* ONE card left */
.ustrip .uchip.out{filter:grayscale(.7);opacity:.5}
.ustrip .uchip.flash .uava{animation:uflash .5s ease} /* someone hopped over on a skip / sit-out */
@keyframes uflash{30%{filter:grayscale(.6) brightness(.6)}30%,60%{box-shadow:0 0 0 3px var(--fg)}}
.ustrip .udir{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--dim);z-index:5}
/* when the strip is up on a phone, drop the ring of seats + arrows and keep a compact play mat */
.app.stripon .round .seat,.app.stripon #dring,.app.stripon #dirlbl{display:none}
/* compact play mat wherever the strip is up (own-devices phones AND the iPad table): discard left, deck to its right, pot below — no big ring of seats */
.app.stripon .tl-round .round{width:min(100%,300px);height:92px;aspect-ratio:auto;margin:.3rem auto} /* v2.8.45: short single-row mat — pot · last-played · deck, no stacked pot */
.app.stripon .round .felt{inset:0;border-radius:16px}
.app.stripon .round .halo{display:none}
.app.stripon .round .potchip{left:13%;top:50%;bottom:auto;transform:translate(-50%,-50%);text-align:center} /* pot on the LEFT */
.app.stripon .round .potchip .n{font-size:1.05rem}
.potchip .potcol{font-weight:800;text-transform:capitalize;font-size:.9rem;line-height:1.05;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)} /* v2.8.49: current colour after a wild/steal — the word, in that colour */
.app.stripon .round .pile{left:37%;top:50%} /* last-played card in the MIDDLE */
.app.stripon .round .pile .card.lg{transform:scale(.42)}
.app.stripon .round .deck{left:60%;top:50%} /* deck RIGHT-of-centre; stacked Play/Draw tuck in on the far right */
/* v2.8.48: stacked Play/Draw live INSIDE the mat (right) on every screen — phone AND desktop/iPad — not a separate row below the hand */
.app.stripon .handwrap{position:relative}
.app.stripon .handwrap .actions{position:absolute;top:34px;left:auto;right:calc((100% - 300px)/2 + 2px);bottom:auto;flex-direction:column;gap:5px;width:60px;margin:0;z-index:3;background:none;padding:0;max-width:none}
.app.stripon .handwrap .actions button{flex:none;width:100%;padding:.42rem .15rem;font-size:.8rem;border-radius:9px;line-height:1.1}
.app.stripon .round .deck .card{width:38px;height:55px}
.app.stripon .round .deck .n{font-size:.56rem;margin-top:1px}
.app.stripon .round .stackbadge{left:50%;top:2px;bottom:auto;transform:translateX(-50%);font-size:.95rem;padding:.12rem .55rem}
.app.stripon .hand{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start} /* v2.8.45: pack colour-groups into centered rows on EVERY screen (phone + wide/PC) so the hand is never a tall sparse column */
.app.stripon .hand .card{width:42px;height:62px;border-radius:8px}.app.stripon .hand .card .v{font-size:1.3rem}.app.stripon .hand .card .cn{font-size:.56rem}
.app.stripon{padding-top:calc(116px + env(safe-area-inset-top,0px))}
body.hasvid .app.stripon{padding-top:calc(236px + env(safe-area-inset-top,0px))}
body.hasvid.tbl .ustrip{top:calc(136px + env(safe-area-inset-top,0px))} /* iPad table video bar is a touch taller */
body.hasvid.tbl .app.stripon{padding-top:calc(248px + env(safe-area-inset-top,0px))}
.app.stripon .oppstrip{display:none} /* the top strip already shows every player + their count */
.app.stripon .status .card,.app.stripon .status .big,.app.stripon .status .arrow{display:none} /* carousel shows whose turn + direction, discard shows the card — keep only the colour · pot line */
.app.stripon .status{padding:3px 10px;min-height:0}
.app.stripon .tlayout.withhand{gap:8px}
.tlayout.withhand.merged .hrow{justify-content:center} /* v2.8.39: center each colour-row so the compact hand sits under the centered mat, not stranded left in a wide empty panel */
/* portrait phones: a slightly smaller mat + smaller hand cards + tighter spacing so the deck and your whole hand are on-screen without scrolling */
@media (max-width:820px){
  .app.stripon .status{margin:.3rem 0;padding:7px 10px}
  .app.stripon .hand{margin:.4rem 0;gap:6px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start} /* v2.8.43: pack colour-groups into ~2 centered rows (was one tall column of per-colour rows) so mat + whole hand + Play/Draw fit without scrolling */
  .app.stripon .hrow{gap:5px}
  .app.stripon .hand .card{width:40px;height:60px;border-radius:7px} /* v2.8.47: hand cards match the mat's last-played card */
  .app.stripon .hand .card .v{font-size:1.15rem}
  .app.stripon .hand .card .cn{font-size:.5rem}
}
/* landscape / short height (incl. iPad Safari with the bookmarks bar): single column — compact mat on top, your hand below, side hidden */
@media (orientation:landscape) and (max-height:560px){
  .app.stripon .ustrip{height:72px}
  .app.stripon .ustrip .utrack{top:calc(5px + env(safe-area-inset-top,0px));height:62px}
  .app.stripon .ustrip .uava{width:40px;height:40px;font-size:1rem}
  .app.stripon .ustrip .unm{font-size:.62rem;margin-top:1px}
  .app.stripon .ustrip .ucnt{min-width:16px;height:16px;font-size:.6rem}
  .app.stripon{padding-top:calc(80px + env(safe-area-inset-top,0px))}
  .app.stripon .tlayout.withhand{grid-template-columns:1fr;grid-template-areas:"round" "hand"} /* keep the compact mat (discard · pot · deck) on top — it no longer gets dropped in short landscape */
  .app.stripon .tlayout.withhand .tl-round{margin-top:-4px}
  .app.stripon .tlayout.withhand .tl-side{display:none}
  .app.stripon .status{margin:.25rem 0;padding:6px 10px}
  .app.stripon .hand{margin:.3rem 0;gap:5px;flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start} /* v2.8.43: pack the hand here too — short landscape has little height */
  .app.stripon .hand .card{width:42px;height:62px;border-radius:7px}
  .app.stripon .hand .card .v{font-size:1.3rem}
}
/* phone */
.status{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:10px 12px;margin:.5rem 0}
.status .txt{flex:1;min-width:0}
.status .big{font-family:"Fredoka",sans-serif;font-size:1.25rem;font-weight:600;line-height:1.15}
.arrow{font-size:1.6rem;line-height:1;display:inline-block}
.hand{display:flex;flex-direction:column;gap:8px;margin:.8rem 0}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.hand button.cb{padding:0;background:none;border-radius:9px;transition:transform .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.hand button.cb.holding .card{animation:hold .6s linear forwards}
@keyframes hold{to{box-shadow:0 0 0 4px var(--gold),0 0 22px rgba(255,209,102,.8),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 5px var(--c);transform:translateY(-14px) scale(1.06)}}
.actions .glow{background:var(--gold);color:#2b2200;animation:pulse 1s ease-in-out infinite alternate}
.unobtn{display:block;width:100%;margin:.5rem 0;padding:.9rem;font-family:"Fredoka",sans-serif;font-size:1.4rem;background:var(--R);color:#fff;border-radius:16px;animation:pulse 1s ease-in-out infinite alternate}
.unobtn.called{background:rgba(255,255,255,.12);animation:none;font-size:1rem}
.catchbtn{display:block;width:100%;margin:.5rem 0;padding:.8rem;font-family:"Fredoka",sans-serif;font-size:1.2rem;background:var(--gold);color:#2b2200;border-radius:16px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 4px}
.presets button{padding:.6rem .3rem;line-height:1.15}.presets button small{display:block;font-weight:400;font-size:.7rem;opacity:.8}
.presets button.on{background:var(--gold);color:#2b2200}
details.more summary{cursor:pointer;padding:6px 0;color:var(--dim)}
.howto .step{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.howto .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2b2200;font-weight:700;display:flex;align-items:center;justify-content:center}
.hand button.cb.sel{transform:translateY(-12px)}
.hand button.cb.sel .card{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 5px var(--c)}
.hand button.cb.no .card{filter:saturate(.35) brightness(.7)}
.hand button.cb.addable .card{box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 5px var(--c);animation:addpulse 1.1s ease-in-out infinite} /* a matching card you can stack onto your selection */
@keyframes addpulse{50%{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(255,209,102,.75),inset 0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 5px var(--c)}}
@media (prefers-reduced-motion:reduce){.hand button.cb.addable .card{animation:none}}
.hand button.cb.new .card::after{content:'new';position:absolute;top:-8px;right:-6px;background:var(--gold);color:#2b2200;font:600 .6rem -apple-system,sans-serif;padding:1px 5px;border-radius:999px}
.deckbtn{padding:0;background:none;border-radius:14px}.deckbtn:active .card{transform:translateY(3px) scale(.97)}
.deckbtn .card{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(255,209,102,.5),inset 0 0 0 3px rgba(255,255,255,.85)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(20,22,44,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:8px;max-width:560px;margin:0 auto}
.actions button{flex:1;padding:.9rem .5rem;font-size:1.05rem}
.actions .play{background:var(--gold);color:#2b2200}
.app.table .actions{position:static;background:none;padding:0;max-width:none}

/* overlays */

.fan{text-align:center;padding:1.2rem 1.8rem;border-radius:26px;background:var(--bc,#fff);color:var(--bt,#1b1e3a);box-shadow:0 24px 70px rgba(0,0,0,.55);max-width:88vw;animation:pop .45s cubic-bezier(.2,1.5,.4,1),fade .5s 2.6s forwards}

@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
@keyframes fade{to{opacity:0;transform:scale(.9)}}
.spark{position:absolute;font-size:1.6rem;animation:spark 1.3s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.scores table{width:100%;border-collapse:collapse}.scores td{padding:5px 0;border-top:1px solid var(--line)}

.scores tr.me td:first-child{color:var(--gold)}

#sndhint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(0,0,0,.75);color:#fff;font-size:.85rem;padding:.45rem .9rem;border-radius:999px;pointer-events:none}

.tile{position:relative;flex:none;width:78px;height:104px;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 2px 6px rgba(0,0,0,.4)}

.lobbyc .lt{font-size:1.3rem;font-weight:600;margin:.8rem 0 .4rem}
.lobbyc ol{text-align:left;margin:0 auto;padding-left:1.3rem;font-family:-apple-system,"Segoe UI",sans-serif;font-size:.9rem;color:var(--dim);max-width:260px}.lobbyc li{margin:.25rem 0}.lobbyc b{color:var(--fg)}
.foot{margin-top:1.4rem;text-align:center;font-size:.85rem;color:var(--dim)}
.foot button{margin:3px}
</style>

<body>
<div class="app" id="app"></div>
<div id="ustripwrap"></div>
<div id="vid"></div>
<div id="ovl"></div>
<div id="banner"></div>
<div class="conn" id="conn"></div>
<div id="sndhint" hidden>🔇 Tap anywhere for sound</div>
<script>
(function(){
const VERSION='v2.8.54 · 28 Oct 2026'; // shown at the bottom of every screen
const COLS=['R','Y','G','B'], CNAME={R:'red',Y:'yellow',G:'green',B:'blue'};
const WILDS=['wild','w4','steal','pass','mirror','cust'];
const LBL={skip:'⊘',rev:'⇄',d2:'+2',wild:'',w4:'+4',steal:'⇆',pass:'⇢',mirror:'+✋',cust:'★'};
const WNAME={wild:'Wild',w4:'Wild +4',steal:'Steal',pass:'Pass left',mirror:'Copy hand',cust:'Custom'};
const RULES=[['multi','Play several identical cards at once'],['stack','Stack +2s and +4s onto the next player'],['playPicked','After picking up, you can play one of the cards you picked up (not a draw card)'],['steal','Add 2 “Steal a hand” wild cards'],['pass','Add 2 “Everyone pass left” wild cards'],['mirror','Add 2 “Copy my hand” wild cards: the next player picks up as many cards as you hold'],['drawUntil','Keep drawing until you can play'],['official','Official draw rules: after drawing you may only play the card you drew, and a +4 only when you have no card of the current colour'],['callUno','Call UNO! on your second-last card, or anyone can catch you and you pick up 2'],['useCustoms','Use the custom wild cards below']];
const PRESETS={official:{multi:false,stack:false,playPicked:false,steal:false,pass:false,mirror:false,drawUntil:false,official:true,callUno:true,useCustoms:false},party:{multi:true,stack:true,playPicked:true,steal:true,pass:true,mirror:false,drawUntil:false,official:false,callUno:false,useCustoms:true},chaos:{multi:true,stack:true,playPicked:true,steal:true,pass:true,mirror:true,drawUntil:false,official:false,callUno:false,useCustoms:true}};
const presetOf=r=>Object.keys(PRESETS).find(k=>Object.keys(PRESETS[k]).every(x=>!!r[x]===PRESETS[k][x]))||'';
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const get=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}}, set=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let pid=get('fk-pid'); if(!pid){ pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36); set('fk-pid',pid); }
let myPhoto=get('fk-photo')||''; const photos={}; if(myPhoto) photos[pid]=myPhoto; // selfie avatars keyed by pid (shared via the {t:'photo'} channel; emoji fallback)
const qs=new URLSearchParams(location.search);
const framed=qs.get('framed')==='1'||window.parent!==window; // inside the Game Night shell: the shell owns the camera + video bar, so this frame runs video-free and never navigates away
function tellShell(action){ try{ window.parent.postMessage({gn:'action',action},'*'); }catch(e){} }
let room=(qs.get('room')||get('uno-room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
let mode=qs.get('mode')||get('uno-mode')||'';
let wantLayout=qs.get('layout')==='phones'?'phones':'', autoVidTried=false; let emoji=get('fk-emoji')||''; let nick=get('fk-nick'), sfxOn=get('fk-sfx')!=='0', winOn=get('fk-win')!=='0', unoHints=get('uno-hints')==='1', showRules=false;
let S=null, ws=null, reconnectIn=800, skew=0, sel=[], viewMsg='', lastEvent=0, animDir=null, overlay=null, nudged='', customDraft=null, autoTried=false, autoStartTried=false, autoNextOff=false, dealingUntil=framed?Date.now()+6000:0, holdT=null, held=false;
const app=document.getElementById('app'), ovlEl=document.getElementById('ovl'), connEl=document.getElementById('conn');
const isTbl=()=>mode==='table'||mode==='both';
const pidx=(st,id)=>st.players.findIndex(p=>p.id===id);
const local=t=>t?t-skew:0;
const fmt=n=>n>=60?Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):String(n);
const isWild=c=>WILDS.includes(c.v);
const same=(a,b)=>a.c===b.c&&a.v===b.v&&a.t===b.t;
function newCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }

/* ---------- cards ---------- */
function cardHTML(c,size,extra){
  const cls=`card ${size||''} ${c.c!=='W'?c.c:''} ${isWild(c)?'wildv':''} ${extra||''}`;
  if(isWild(c)){ const lbl=c.v==='cust'&&S&&S.customs?(S.customs[c.t]||'Custom'):WNAME[c.v]; return `<div class="${cls}"><div class="wheel"></div>${LBL[c.v]?`<span class="v">${LBL[c.v]}</span>`:''}<span class="wlbl">${esc(lbl.length>12?lbl.slice(0,11)+'…':lbl)}</span></div>`; }
  const v=/^\d$/.test(c.v)?c.v:LBL[c.v];
  return `<div class="${cls}"><span class="cn">${v}</span><span class="v">${v}</span><span class="cn b">${v}</span></div>`;
}
const backHTML=size=>`<div class="card back ${size||''}"></div>`;
function sortHand(h){ const order=c=>(c.c==='W'?9:COLS.indexOf(c.c))*100+(/^\d$/.test(c.v)?+c.v:{skip:10,rev:11,d2:12,wild:20,w4:21,steal:22,pass:23,mirror:24,cust:25}[c.v]); return h.slice().sort((a,b)=>order(a)-order(b)); }

/* ---------- connection ---------- */
function connect(){
  if(!room||!mode) return;
  if(ws){ try{ws.onclose=null;ws.close();}catch(e){} }
  set('uno-last',mode);
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/uws/${room}?pid=${encodeURIComponent(pid)}&role=${mode}`);
  connEl.textContent='connecting…';
  ws.onopen=()=>{ connEl.textContent='● live'; reconnectIn=800; keepAwake(); ws.send(JSON.stringify({t:'hello'})); if(myPhoto) ws.send(JSON.stringify({t:'photo',photo:myPhoto})); if(!framed&&rtc.on) ws.send(JSON.stringify({t:'video',on:true})); if(!framed&&isTbl()) loadIce(); };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.t==='err'){ viewMsg=m.msg; render(); setTimeout(()=>{viewMsg='';render();},2600); return; }
    if(m.t==='rtc'){ onRtc(m.from,m.data); return; }
    if(m.t==='photo'){ if(m.photo) photos[m.pid]=m.photo; else delete photos[m.pid]; if(S) paintStrip(S); return; }
    if(m.t==='closed'){ if(!framed) location.replace('/?home=1'); return; } // session finished (standalone goes home; framed is handled by the shell)
    if(m.t==='state'){ const old=S; S=m.s; onState(S,old); render(); syncPeers(); } };
  ws.onclose=()=>{ connEl.textContent='reconnecting…'; setTimeout(connect,reconnectIn); reconnectIn=Math.min(reconnectIn*1.6,8000); };
}
const send=o=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }, sendMsg=send;
function onState(st,old){
  skew=st.serverNow-Date.now();
  // the table moved everyone to another game: follow it (same code, same name)
  if(st.goto&&st.goto.to==='fk'&&st.goto.at>+(qs.get('from')||0)){ if(framed) return; const bots=st.host&&st.goto.bots?'&bots='+st.goto.bots:''; const toRoom=!!st.goto.lounge&&mode!=='table'; if(toRoom&&st.host) set('fk-lhost',room); location.replace('/?room='+room+'&mode='+(toRoom?'lounge':mode)+'&from='+st.goto.at+bots+(toRoom&&st.host?'&lounge=1':'')); return; }
  if(mode!=='table'&&!autoTried&&!st.players.some(p=>p.id===pid)&&nick){ autoTried=true; send({t:'join',name:nick,emoji}); }
  else if(!st.players.some(p=>p.id===pid)) autoTried=true;
  if(qs.get('bots')&&st.host&&st.phase==='lobby'&&!st.players.some(p=>p.bot)){ for(let k=0;k<Math.min(9,+qs.get('bots'));k++) send({t:'addbot'}); history.replaceState(null,'','/uno.html?room='+room+'&mode='+mode+(qs.get('from')?'&from='+qs.get('from'):'')); qs.delete('bots'); }
  if(st.phase==='lobby'&&old&&old.phase&&old.phase!=='lobby') autoStartTried=false; // v2.8.44: a reset ("Clear the table") or finished game dropped back to a fresh lobby — re-arm the room-launch auto-deal so it re-deals instead of stranding everyone in "Setting up…"
  if(framed&&st.host&&st.phase==='lobby'&&st.players.length>=2&&!autoStartTried){ autoStartTried=true; setTimeout(()=>{ if(S&&S.host&&S.phase==='lobby'&&S.players.length>=2) send({t:'start'}); },1200); } // launched from the room: deal straight in once 2+ players are present — never auto-adds a bot (bots are added only by tapping Add a bot)
  if(framed&&st.host&&st.phase==='over'&&st.autoNext&&!autoNextOff){ autoNextOff=true; send({t:'settings',autoNext:false}); } // room flow: no auto-advance — "Play another game" is an explicit tap
  if(wantLayout&&st.host){ send({t:'settings',layout:wantLayout}); wantLayout=''; }
  // video was on before (e.g. in the Game Night room): switch it back on
  if(!framed&&!autoVidTried&&get('gn-video')==='1'&&mode!=='table'&&!rtc.on){ autoVidTried=true; setTimeout(()=>{ if(!rtc.on) startVideo(); },400); }
  if(mode!=='table'&&!get('uno-howto')&&!overlay){ overlay={k:'howto'}; set('uno-howto','1'); }
  const me=st.players.find(p=>p.id===pid);
  if(me&&me.hand) sel=sel.filter(id=>me.hand.some(c=>c.id===id));
  if(!old||old.turn!==st.turn||old.phase!==st.phase) sel=[];
  if(st.phase!=='play'&&overlay&&overlay.k!=='howto') overlay=null;
  if(animDir===null) animDir=st.dir;
  if(st.event&&st.event.at!==lastEvent){ const first=!lastEvent; lastEvent=st.event.at; if(!first) react(st,old); else animDir=st.dir; }
  else if(!st.event||st.event.t!=='play'||!st.event.revs) animDir=st.dir;
  if(old&&st.phase==='play'&&old.phase==='play'&&st.picking&&st.deckCount<old.deckCount) sfx.flick();
  if(old&&me&&st.phase==='play'&&st.players[st.turn].id===pid&&(old.turn!==st.turn||old.phase!=='play')&&mode!=='table') sfx.ping();
}

/* ---------- reactions: banners, sounds, speech, reverse animation ---------- */
function react(st,old){
  const e=st.event, nm=i=>st.players[i]?st.players[i].name:'?';
  if(e.t==='play'){
    sfx.card(e.k);
    const col=e.colour, bc=`var(--${col})`, bt=col==='Y'?'#2b2200':'#fff', x=e.k>1?` ×${e.k}`:'';
    if(e.v==='skip') banner('⊘ Skip!'+x, e.k>1?`${e.k} players skipped`:'Next player loses a turn',bc,bt);
    else if(e.v==='rev') { banner('⇄ Reverse!'+x, e.k>1?`${e.k} reverses: watch the arrow`:'Play changes direction',bc,bt); animateReverse(e.dirFrom,e.revs); }
    else if(e.v==='d2'||e.v==='w4') banner((e.v==='d2'?'+2':'+4')+x, st.drawStack?`${nm(st.turn)} faces +${st.drawStack}`:'',e.v==='w4'?'#17171c':bc,'#fff');
    else if(e.v==='cust') banner(e.text||'Custom card!', `${nm(e.who)} played a custom wild · colour ${CNAME[col]}`,'#17171c','#fff','custom long');
    else if(e.v==='steal') banner('⇆ Hands swapped!', `${nm(e.who)} ↔ ${nm(e.target)}`,bc,bt);
    else if(e.v==='pass') banner('⇢ Pass left!', 'Everyone passes their hand to the left',bc,bt);
    else if(e.v==='mirror') banner(`+${e.mirror}!`, `Copy my hand: ${nm(st.turn)} faces +${st.drawStack}`,'#17171c','#fff');
    else if(e.v==='wild') banner('Wild!', `Colour is now ${CNAME[col]}`,bc,bt);
    if(['skip','rev','d2','w4','wild','steal','pass','mirror','cust'].includes(e.v)) sfx.chime(false);
    if(e.one!==undefined&&!['rev','skip','d2','w4','wild','steal','pass','mirror','cust'].includes(e.v)) banner('One card!', `${nm(e.one)} has one card left`,'#fff','#1b1e3a');
    if(isTbl()) say(speechFor(st,e));
  } else if(e.t==='uno'){ banner('UNO!', `${nm(e.who)} called it`,'var(--R)','#fff'); sfx.chime(false); if(isTbl()) say(nm(e.who)+' says UNO!'); }
  else if(e.t==='caught'){ banner('Caught!', `${nm(e.by)} caught ${nm(e.who)} not calling UNO: +${e.n}`,'var(--gold)','#2b2200'); sfx.deal(); if(isTbl()) say(nm(e.who)+' got caught! Pick up two.'); }
  else if(e.t==='pickup'){ banner(`+${e.n}`, `${nm(e.who)} picked up ${e.n}`,'#fff','#1b1e3a'); if(isTbl()) say(`${nm(e.who)} picked up ${e.n}`); }
  else if(e.t==='win'){
    const names=e.who.map(nm).join(' & ');
    banner(`${names} win${e.who.length>1?'':'s'}!`, `$${e.won} from the pot${e.who.length>1?' each':''} · ${e.why}`,'linear-gradient(160deg,#fff4c2,#ffd166)','#2b2200','long',true);
    if(winOn){ sfx.chime(true); coins(26,.35); } if(isTbl()) say(`${names} win${e.who.length>1?'':'s'} ${e.won} dollars!`);
  }
}
function speechFor(st,e){ const nm=st.players[e.who]?st.players[e.who].name:''; const m={skip:'Skip!',rev:e.k>1?e.k+' reverses!':'Reverse!',d2:'Draw two!',w4:'Wild draw four!',wild:'Wild, '+CNAME[e.colour],steal:'Steal a hand!',pass:'Everyone pass left!',mirror:'Copy my hand! Pick up '+e.mirror,cust:e.text||'Custom card'}; return m[e.v]||''; }
function animateReverse(from,k){
  animDir=from; drawRing();
  for(let r=1;r<=k;r++) setTimeout(()=>{ animDir*=-1; drawRing(true,r,k); if(r>1) sfx.tap(); },650*r);
}
function drawRing(flip,r,k){
  const el=document.getElementById('dring'); if(!el) return;
  el.className='dring '+(animDir===1?'cw':'ccw')+(flip?' flip':'');
  const lbl=document.getElementById('dirlbl'); if(lbl) lbl.textContent=(animDir===1?'↻ clockwise':'↺ anticlockwise')+(flip&&k>1?` (reverse ${r} of ${k})`:'');
  const pa=document.getElementById('parrow'); if(pa) pa.textContent=animDir===1?'↻':'↺';
}
/* ---- v2.8.1 turn strip (phones): a thin top strip of players that glides to the next turn ---- */
const USTRIP_COPIES=9, USTRIP_MID=4, UHUE=[205,0,275,150,35,320,95,250,15,180];
let utrackEl=null, udirEl=null, uchips=[], uN=0, uCur=0, uDir=1, uPrevTurn=null, uKey='', stripShown=false;
function ensureStrip(){
  if(utrackEl) return;
  const wrap=document.getElementById('ustripwrap');
  wrap.innerHTML='<div class="ustrip" id="ustrip"><div class="utrack" id="utrack"></div><div class="udir" id="udir"></div></div>';
  utrackEl=document.getElementById('utrack'); udirEl=document.getElementById('udir');
}
function uMyIndex(st){ for(let i=0;i<st.players.length;i++) if(st.players[i].id===pid) return i; return -1; }
function uFace(p){ return p.bot?'🤖':(p.emoji||((p.name||'?').charAt(0).toUpperCase())); }
function buildStrip(st){
  ensureStrip(); const n=st.players.length; uN=n; utrackEl.innerHTML=''; uchips=[];
  for(let c=0;c<USTRIP_COPIES;c++) for(let i=0;i<n;i++){ const g=c*n+i;
    const el=document.createElement('div'); el.className='uchip'; el.dataset.g=g;
    el.innerHTML='<div class="uava"><span class="uface"></span><span class="ucnt"></span></div><div class="unm"></div>';
    utrackEl.appendChild(el); uchips.push({el,g,pi:i});
  }
  uCur=USTRIP_MID*n+st.turn; uDir=st.dir; uPrevTurn=st.turn; paintStrip(st); placeStrip(false);
}
function paintStrip(st){
  const playing=st.phase==='play', meI=uMyIndex(st);
  for(const ch of uchips){ const p=st.players[ch.pi]; if(!p) continue;
    const av=ch.el.querySelector('.uava'), ph=!p.bot&&photos[p.id];
    if(ph){ av.style.backgroundImage='url('+ph+')'; av.style.backgroundSize='cover'; av.style.backgroundPosition='center'; av.style.backgroundColor=`hsl(${UHUE[ch.pi%UHUE.length]} 55% 44%)`; ch.el.querySelector('.uface').textContent=''; }
    else { av.style.backgroundImage=''; av.style.background = p.bot?'var(--panel)':`hsl(${UHUE[ch.pi%UHUE.length]} 55% 44%)`; ch.el.querySelector('.uface').textContent = uFace(p); }
    ch.el.querySelector('.ucnt').textContent = (playing&&p.in)?p.cards:'';
    ch.el.querySelector('.unm').textContent = (ch.pi===meI?'You':p.name);
    ch.el.classList.toggle('one', playing&&p.in&&p.cards===1);
    ch.el.classList.toggle('out', playing&&!p.in);
  }
}
function placeStrip(animated){
  const el=document.getElementById('ustrip'); if(!el||!uchips.length) return;
  if(!animated) el.classList.add('noanim');
  const w=el.clientWidth||340, step=Math.min(78,w*0.21);

function handHTML(st){ return handMain(st)+(st.phase!=='play'?scoresHTML(st):''); }
function handMain(st,embedded){
  const i=pidx(st,pid), p=i>=0?st.players[i]:null;

  // play
  if(!p.in) return `${statusHTML(st,i)}<div class="center dim" style="padding:1.5rem 0">${p.queued?`<h2 style="color:var(--fg)">You're in, ${esc(p.name)}!</h2>You'll be dealt in when the next game starts.<br>${notYou}`:p.left?'You left this game. You\'re back in next game.':'You couldn\'t cover the stake this game.'}${p.balance<st.stake&&!p.queued?' Rebuy between games to get back in.':''}</div>`;

  const handH=`<div class="hand">${['R','Y','G','B','W'].filter(k=>rows[k]).map(k=>`<div class="hrow">${rows[k].map(c=>`<button class="cb ${sel.includes(c.id)?'sel':''} ${unoHints&&mine&&!can.has(c.id)&&!sel.length?'no':''} ${unoHints&&mine&&st.rules.multi&&selCard&&!sel.includes(c.id)&&same(selCard,c)&&can.has(c.id)?'addable':''} ${unoHints&&st.picked&&mine&&st.picked.includes(c.id)?'new':''}" data-card="${c.id}" aria-label="${c.c==='W'?WNAME[c.v]:CNAME[c.c]+' '+c.v}">${cardHTML(c)}</button>`).join('')}</div>`).join('')}</div>`;
  const first=selCard, okPlay=mine&&first&&(!unoHints||can.has(first.id));
  let acts='', deck='';

    const done=st.picking?st.pickTotal-st.drawStack:0, tot=st.picking?st.pickTotal:st.drawStack;
    deck=`<div class="center" style="margin:.6rem 0"><button class="cb deckbtn" id="drawdeck" aria-label="Pick up a card">${backHTML('lg')}</button><div class="disp" style="font-size:1.2rem;margin-top:6px">${st.picking?`Tap the deck: ${st.drawStack} to go`:`Tap the deck to pick up ${tot}`}</div><div class="small dim">${st.picking?`${done} of ${tot} picked up`:can.size?'…or stack a draw card on it.':''}</div></div>`;
  }

  const called=(st.unoCalled||{})[pid], unoB=st.rules.callUno&&hand.length<=2&&(mine||st.catchable===i)?`<button class="unobtn ${called?'called':''}" id="calluno">${called?'UNO! called ✓':'Call UNO!'}</button>`:'';

  return `${statusHTML(st,i)}${nudge}${catchB}${deck}${handH}${unoB}${mine?`<p class="small dim center">${playHint}</p>`:''}${acts}
    <p class="center" style="margin-top:1.4rem"><button class="ghost small" id="quit">Leave this game</button></p>`;
}

function tick(){

function tryPlay(colour,target){
  const me=S.players.find(p=>p.id===pid); if(!me||!sel.length) return;
  const c=me.hand.find(x=>x.id===sel[0]); if(!c) return;
  if(isWild(c)&&!colour){ overlay={k:'colour'}; render(); return; }
  const needT=c.v==='steal';
  if(needT&&!target){ overlay={k:'target',colour}; render(); return; }
  send({t:'play',ids:sel,colour,target}); sel=[]; overlay=null; sfx.tap(); render();
}

  on('#howto',()=>{ overlay={k:'howto'}; render(); });
  on('#switchgame',()=>{ if(confirm('Switch everyone at this table to 4 Kings? Phones follow automatically.')){ if(framed){ send({t:'switchgame',to:'fk'}); tellShell('switch-fk'); } else send({t:'switchgame',to:'fk'}); } });
  document.querySelectorAll('#toroom').forEach(b=>b.onclick=()=>{ if(confirm('Take everyone back to the Game Night room? Money and the scoreboard are kept; bots leave.')){ if(framed){ send({t:'switchgame',to:'fk',room:true}); tellShell('back-to-room'); } else send({t:'switchgame',to:'fk',room:true}); } });
  document.querySelectorAll('[data-turnms]').forEach(b=>b.onclick=()=>send({t:'settings',turnMs:+b.dataset.turnms}));
  document.querySelectorAll('[data-autonext]').forEach(b=>b.onclick=()=>send({t:'settings',autoNext:b.dataset.autonext==='1'}));
  document.querySelectorAll('[data-rule]').forEach(b=>b.onchange=()=>send({t:'settings',rule:b.dataset.rule,on:b.checked}));
  document.querySelectorAll('[data-custom]').forEach(b=>b.oninput=()=>{ customDraft=(customDraft||S.customs.slice()); customDraft[+b.dataset.custom]=b.value; const sv=q('#savecustom'); if(sv) sv.disabled=false; });
  on('#savecustom',()=>{ send({t:'settings',customs:customDraft||S.customs}); customDraft=null; });
}
if(qs.get('room')&&qs.get('mode')){ set('uno-room',room); set('uno-mode',mode); }
if(['table','both','phones'].includes(qs.get('setup'))){ room=newCode(); mode=qs.get('setup')==='table'?'table':'both'; if(qs.get('setup')==='phones') wantLayout='phones'; set('uno-room',room); set('uno-mode',mode); history.replaceState(null,'','/uno.html'); }
render(); renderVideo(); if(room&&mode) connect();
})();
</script>
</body>
</html>
